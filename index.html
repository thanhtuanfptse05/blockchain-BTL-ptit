    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.js"></script>
    <script>
        const files = {"src/__init__.py": "\"\"\"DeFi Liquidation Cascade Simulator source package.\"\"\"\n\n", "src/domain/agent.py": "\"\"\"Borrower Agent domain model.\n\n# Implements FR-001, FR-002, FR-005, FR-009, FR-011\n\"\"\"\n\nfrom dataclasses import dataclass\nfrom enum import Enum\nimport math\n\n\nclass AssetType(str, Enum):\n    \"\"\"Supported collateral asset types in the lending protocol.\"\"\"\n\n    ETH = \"ETH\"\n    STETH = \"stETH\"\n\n\nclass AgentStatus(str, Enum):\n    \"\"\"Lifecycle status of a simulated borrower position.\"\"\"\n\n    ACTIVE = \"ACTIVE\"\n    REPAID = \"REPAID\"\n    BAD_DEBT = \"BAD_DEBT\"\n\n\n@dataclass\nclass BorrowerAgent:\n    \"\"\"Borrower agent representing a leveraged collateralized debt position.\n\n    Attributes:\n        agent_id: Unique integer identifier (1 to N).\n        collateral_type: Asset deposited as collateral (ETH or stETH).\n        collateral_amount: Quantity of tokens held as collateral.\n        debt_usdc: Outstanding borrow debt in USDC.\n        initial_ltv: Initial Loan-To-Value ratio drawn from [0.55, 0.72].\n        liquidation_threshold: Protocol liquidation threshold ratio (default 0.80).\n        ever_liquidated: Flag indicating whether this position was ever liquidated.\n        liquidation_count: Total count of liquidation events experienced.\n        status: Current position lifecycle status (ACTIVE, REPAID, BAD_DEBT).\n    \"\"\"\n\n    agent_id: int\n    collateral_type: AssetType\n    collateral_amount: float\n    debt_usdc: float\n    initial_ltv: float\n    liquidation_threshold: float = 0.80\n    ever_liquidated: bool = False\n    liquidation_count: int = 0\n    status: AgentStatus = AgentStatus.ACTIVE\n\n    def collateral_value(self, eth_price_usd: float, steth_price_usd: float) -> float:\n        \"\"\"Calculate USD collateral value at current prices (FR-009).\"\"\"\n        price = eth_price_usd if self.collateral_type == AssetType.ETH else steth_price_usd\n        return self.collateral_amount * price\n\n    def health_factor(self, eth_price_usd: float, steth_price_usd: float) -> float:\n        \"\"\"Calculate current Health Factor (FR-009).\"\"\"\n        if self.debt_usdc <= 1e-9:\n            return math.inf\n        val = self.collateral_value(eth_price_usd, steth_price_usd)\n        if val <= 1e-9:\n            return 0.0\n        return (val * self.liquidation_threshold) / self.debt_usdc\n\n    def is_liquidatable(self, eth_price_usd: float, steth_price_usd: float) -> bool:\n        \"\"\"Check if position is eligible for liquidation (FR-009).\"\"\"\n        if self.status in (AgentStatus.REPAID, AgentStatus.BAD_DEBT):\n            return False\n        if self.debt_usdc <= 1e-9 or self.collateral_amount <= 1e-9:\n            return False\n        return self.health_factor(eth_price_usd, steth_price_usd) < 1.0\n\n    def apply_liquidation(self, debt_repaid: float, collateral_seized: float) -> None:\n        \"\"\"Apply the results of a partial liquidation to this agent (FR-011).\n\n        Deducts debt and collateral without allowing negative values, updates\n        liquidation flags, and transitions status to REPAID or BAD_DEBT if applicable.\n        \"\"\"\n        self.debt_usdc = max(0.0, self.debt_usdc - debt_repaid)\n        self.collateral_amount = max(0.0, self.collateral_amount - collateral_seized)\n        self.ever_liquidated = True\n        self.liquidation_count += 1\n\n        if self.debt_usdc <= 1e-9:\n            self.debt_usdc = 0.0\n            self.status = AgentStatus.REPAID\n        elif self.collateral_amount <= 1e-9:\n            self.collateral_amount = 0.0\n            self.status = AgentStatus.BAD_DEBT\n        else:\n            self.status = AgentStatus.ACTIVE\n", "src/domain/amm_pool.py": "\"\"\"AMM Constant Product Pool domain entity.\n\n# Implements FR-002, FR-003, FR-004, FR-006, FR-007, SRS \u00a77.2\n\"\"\"\n\nfrom dataclasses import dataclass\nimport math\n\n\n@dataclass\nclass AMMPool:\n    \"\"\"Constant-product Automated Market Maker (AMM) liquidity pool.\n\n    Implements x * y = k invariant without trading fees.\n\n    Attributes:\n        name: Identifier name (e.g., \"ETH_USDC\" or \"STETH_ETH\").\n        token_x: Base asset symbol (ETH in Pool A, stETH in Pool B).\n        token_y: Quote asset symbol (USDC in Pool A, ETH in Pool B).\n        reserve_x: Current reserve quantity of token x (> 0).\n        reserve_y: Current reserve quantity of token y (> 0).\n    \"\"\"\n\n    name: str\n    token_x: str\n    token_y: str\n    reserve_x: float\n    reserve_y: float\n\n    @property\n    def k(self) -> float:\n        \"\"\"Constant product invariant k = reserve_x * reserve_y.\"\"\"\n        return self.reserve_x * self.reserve_y\n\n    @property\n    def spot_price(self) -> float:\n        \"\"\"Spot price of token x denominated in token y (reserve_y / reserve_x).\"\"\"\n        return self.reserve_y / self.reserve_x\n\n    def sell_x(self, delta_x: float) -> float:\n        \"\"\"Execute a swap depositing delta_x and withdrawing delta_y with zero fee.\n\n        # Implements BR-05, FR-004\n\n        Args:\n            delta_x: Input token x amount (> 0).\n\n        Returns:\n            Output token y amount received.\n\n        Raises:\n            ValueError: If delta_x is non-positive or non-finite.\n        \"\"\"\n        if not (math.isfinite(delta_x) and delta_x > 0):\n            raise ValueError(f\"Invalid swap input amount: {delta_x}\")\n\n        # Zero-fee constant product formula: dy = (y * dx) / (x + dx)\n        amount_y_out = (self.reserve_y * delta_x) / (self.reserve_x + delta_x)\n\n        self.reserve_x += delta_x\n        self.reserve_y -= amount_y_out\n\n        return amount_y_out\n\n", "src/domain/block_result.py": "\"\"\"BlockResult domain schema.\n\n# Implements FR-013, FR-015, SRS \u00a77.4\n\"\"\"\n\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass BlockResult:\n    \"\"\"Record of market prices, liquidations, and debt metrics for a single simulation block.\n\n    # Implements SRS \u00a77.4 (12 columns)\n\n    Attributes:\n        scenario: Scenario identifier (\"SC01\", \"SC02\", \"SC03\").\n        block: Block index (0 to max_blocks).\n        eth_price_usd: Spot price of ETH in USD at end of block.\n        steth_price_usd: Spot price of stETH in USD at end of block.\n        steth_discount_pct: stETH discount percentage vs ETH.\n        liquidations_eth: Number of ETH liquidation events in this block.\n        liquidations_steth: Number of stETH liquidation events in this block.\n        liquidations_total: Total liquidation events in this block (eth + steth).\n        liquidated_agents_unique_cumulative: Unique agents liquidated up to this block.\n        liquidation_debt_repaid_usd: Total borrow debt repaid by liquidators in this block.\n        liquidation_debt_repaid_cumulative_usd: Cumulative borrow debt repaid up to this block.\n        bad_debt_usd: Current snapshot total bad debt across all positions at end of block.\n    \"\"\"\n\n    scenario: str\n    block: int\n    eth_price_usd: float\n    steth_price_usd: float\n    steth_discount_pct: float\n    liquidations_eth: int\n    liquidations_steth: int\n    liquidations_total: int\n    liquidated_agents_unique_cumulative: int\n    liquidation_debt_repaid_usd: float\n    liquidation_debt_repaid_cumulative_usd: float\n    bad_debt_usd: float\n\n", "src/domain/config.py": "\"\"\"Simulation configuration domain model with strict validation.\n\n# Implements FR-01, FR-02, FR-03, FR-04, FR-05\n# Implements P-01, P-02, P-03, P-04, P-05, P-06\n# Implements C-01, C-02, C-03, C-04, C-05, C-06, C-07, C-08, C-09, C-10\n\"\"\"\n\nfrom pydantic import BaseModel, ConfigDict, Field\n\n\nclass SimulationConfig(BaseModel):\n    \"\"\"Immutable configuration object for DeFi Liquidation Cascade Simulation.\n\n    Attributes:\n        shock_pct: Percentage drop of ETH price at block 1 (0.0 to 50.0).\n        liquidation_threshold: Collateral threshold ratio (0.60 to 0.90).\n        close_factor: Maximum portion of debt repayable per liquidation (0.10 to 1.00).\n        liquidation_penalty: Bonus incentive paid to liquidator (0.00 to 0.20).\n        pool_a_tvl_usd: Total Value Locked in Pool A ETH/USDC ($10M to $500M).\n        pool_b_tvl_usd: Total Value Locked in Pool B stETH/ETH ($5M to $200M).\n        num_borrowers: Total number of generated borrower agents (10 to 500).\n        max_blocks: Total number of discrete blocks to simulate (5 to 100).\n        seed: Random seed for deterministic simulation reproducibility (>= 0).\n    \"\"\"\n\n    model_config = ConfigDict(frozen=True, extra=\"forbid\")\n\n    # Implements P-01, C-01, C-02: ETH price shock percentage\n    shock_pct: float = Field(\n        default=15.0,\n        ge=0.0,\n        le=50.0,\n        description=\"Percentage of initial ETH price drop at block 1.\",\n    )\n\n    # Implements C-03: Liquidation Threshold (unified for ETH and stETH)\n    liquidation_threshold: float = Field(\n        default=0.80,\n        ge=0.60,\n        le=0.90,\n        description=\"Liquidation threshold ratio (LT).\",\n    )\n\n    # Implements C-04: Close Factor\n    close_factor: float = Field(\n        default=0.50,\n        ge=0.10,\n        le=1.00,\n        description=\"Portion of debt repayable in one liquidation call.\",\n    )\n\n    # Implements C-05: Liquidation Penalty Bonus\n    liquidation_penalty: float = Field(\n        default=0.05,\n        ge=0.0,\n        le=0.20,\n        description=\"Bonus collateral paid to liquidator as incentive.\",\n    )\n\n    # Implements P-02, C-06, C-07: Pool A TVL in USD\n    pool_a_tvl_usd: float = Field(\n        default=150_000_000.0,\n        ge=10_000_000.0,\n        le=500_000_000.0,\n        description=\"Total Value Locked in Pool A (ETH/USDC) in USD.\",\n    )\n\n    # Implements P-03, C-08, C-09: Pool B TVL in USD\n    pool_b_tvl_usd: float = Field(\n        default=80_000_000.0,\n        ge=5_000_000.0,\n        le=200_000_000.0,\n        description=\"Total Value Locked in Pool B (stETH/ETH) in USD.\",\n    )\n\n    # Implements P-04, C-10: Number of Borrowers\n    num_borrowers: int = Field(\n        default=100,\n        ge=10,\n        le=500,\n        description=\"Total count of simulated borrower agent positions.\",\n    )\n\n    # Implements P-05: Maximum simulation blocks\n    max_blocks: int = Field(\n        default=30,\n        ge=5,\n        le=100,\n        description=\"Total duration of discrete simulation blocks.\",\n    )\n\n    # Implements P-06: Deterministic Seed\n    seed: int = Field(\n        default=42,\n        ge=0,\n        description=\"Seed for pseudo-random deterministic number generation.\",\n    )\n\n", "src/domain/liquidation_event.py": "\"\"\"LiquidationEvent domain schema.\n\n# Implements FR-005, SRS \u00a77.3\n\"\"\"\n\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass LiquidationEvent:\n    \"\"\"Immutable record of an executed liquidation event.\n\n    Attributes:\n        scenario: Scenario identifier (\"SC02\" or \"SC03\").\n        block: Simulation block number when liquidation occurred.\n        agent_id: Identifier of the liquidated BorrowerAgent.\n        asset: Collateral asset type (\"ETH\" or \"stETH\").\n        hf_before: Health Factor value immediately before liquidation.\n        debt_repaid_usd: Portion of borrow debt repaid by liquidator in USD/USDC.\n        collateral_seized: Quantity of tokens seized from agent's collateral.\n        collateral_value_at_oracle_usd: USD valuation of seized collateral at pre-trade spot.\n        remaining_debt_usd: Remaining borrow debt after partial liquidation.\n        remaining_collateral: Remaining collateral token amount after partial liquidation.\n    \"\"\"\n\n    scenario: str\n    block: int\n    agent_id: int\n    asset: str\n    hf_before: float\n    debt_repaid_usd: float\n    collateral_seized: float\n    collateral_value_at_oracle_usd: float\n    remaining_debt_usd: float\n    remaining_collateral: float\n\n", "src/domain/simulation_result.py": "\"\"\"SimulationResult and KPISummary domain models.\n\n# Implements FR-018, SRS \u00a77.5\n\"\"\"\n\nfrom dataclasses import dataclass\nfrom typing import List, Dict, Any, Optional\nfrom src.domain.config import SimulationConfig\nfrom src.domain.block_result import BlockResult\nfrom src.domain.liquidation_event import LiquidationEvent\n\n\n@dataclass(frozen=True)\nclass KPISummary:\n    \"\"\"Statistical KPI summary for a completed scenario run.\n\n    # Implements FR-018, SRS \u00a77.5, FR-07, FR-11\n\n    Attributes:\n        scenario_id: Scenario identifier (\"SC01\", \"SC02\", \"SC03\").\n        final_eth_price_usd: ETH price at final block.\n        final_steth_price_usd: stETH price at final block.\n        final_steth_discount_pct: stETH discount percentage at final block.\n        liquidated_agents_unique: Total distinct agents ever liquidated.\n        total_agents: Total count of agents in the simulation.\n        liquidated_agents_ratio_pct: Ratio of liquidated agents over total (%).\n        liquidation_events_total: Total number of liquidation events across all blocks.\n        total_debt_repaid_usd: Total borrow debt repaid across all events.\n        bad_debt_usd: Total outstanding bad debt at final block.\n        delta_eth_price_usd: Delta vs SC02 (if applicable).\n        delta_steth_price_usd: Delta vs SC02 (if applicable).\n        delta_steth_discount_pct: Delta vs SC02 (if applicable).\n        delta_liquidated_agents: Additional liquidated agents vs SC02.\n        delta_liquidation_events: Delta liquidation events vs SC02.\n        delta_bad_debt_usd: Delta bad debt vs SC02.\n    \"\"\"\n\n    scenario_id: str\n    final_eth_price_usd: float\n    final_steth_price_usd: float\n    final_steth_discount_pct: float\n    liquidated_agents_unique: int\n    total_agents: int\n    liquidated_agents_ratio_pct: float\n    liquidation_events_total: int\n    total_debt_repaid_usd: float\n    bad_debt_usd: float\n    delta_eth_price_usd: Optional[float] = None\n    delta_steth_price_usd: Optional[float] = None\n    delta_steth_discount_pct: Optional[float] = None\n    delta_liquidated_agents: Optional[int] = None\n    delta_liquidation_events: Optional[int] = None\n    delta_bad_debt_usd: Optional[float] = None\n\n\n@dataclass(frozen=True)\nclass SimulationResult:\n    \"\"\"Container holding the complete output of a single scenario simulation.\n\n    # Implements SRS \u00a77.5, FR-018\n\n    Attributes:\n        scenario_id: Identifier (\"SC01\", \"SC02\", or \"SC03\").\n        parameters: SimulationConfig instance or parameter dictionary.\n        block_results: List of exactly max_blocks + 1 BlockResult records.\n        liquidation_events: List of all recorded LiquidationEvent objects.\n        summary: KPISummary object or summary dictionary with 7 core metrics.\n    \"\"\"\n\n    scenario_id: str\n    parameters: SimulationConfig\n    block_results: List[BlockResult]\n    liquidation_events: List[LiquidationEvent]\n    summary: KPISummary\n\n", "src/domain/__init__.py": "\"\"\"Domain entities and value objects.\"\"\"\n\n", "src/infra/exporter.py": "\"\"\"Data Tables and CSV Exporter infrastructure.\n\n# Implements FR-09, FR-09-01..FR-09-05, ST-08, SRS \u00a77.3, \u00a77.4, \u00a715.1\n\"\"\"\n\nimport io\nfrom typing import Dict, List, Any\nimport pandas as pd\nfrom src.domain.simulation_result import SimulationResult\nfrom src.domain.block_result import BlockResult\nfrom src.domain.liquidation_event import LiquidationEvent\n\nBLOCK_RESULT_COLUMNS = [\n    \"scenario\",\n    \"block\",\n    \"eth_price_usd\",\n    \"steth_price_usd\",\n    \"steth_discount_pct\",\n    \"liquidations_eth\",\n    \"liquidations_steth\",\n    \"liquidations_total\",\n    \"liquidated_agents_unique_cumulative\",\n    \"liquidation_debt_repaid_usd\",\n    \"liquidation_debt_repaid_cumulative_usd\",\n    \"bad_debt_usd\",\n]\n\nLIQUIDATION_EVENT_COLUMNS = [\n    \"scenario\",\n    \"block\",\n    \"agent_id\",\n    \"asset\",\n    \"hf_before\",\n    \"debt_repaid_usd\",\n    \"collateral_seized\",\n    \"collateral_value_at_oracle_usd\",\n    \"remaining_debt_usd\",\n    \"remaining_collateral\",\n]\n\n\ndef block_results_to_dataframe(results: Dict[str, SimulationResult]) -> pd.DataFrame:\n    \"\"\"Consolidate block results from all scenarios into a single Pandas DataFrame.\n\n    # Implements FR-09-01, SRS \u00a77.4\n\n    Args:\n        results: Dictionary mapping scenario IDs to their SimulationResult objects.\n\n    Returns:\n        DataFrame with exactly 12 standardized columns.\n    \"\"\"\n    rows: List[Dict[str, Any]] = []\n    for sc_id in sorted(results.keys()):\n        sim_res = results[sc_id]\n        for b in sim_res.block_results:\n            rows.append({\n                \"scenario\": b.scenario,\n                \"block\": b.block,\n                \"eth_price_usd\": b.eth_price_usd,\n                \"steth_price_usd\": b.steth_price_usd,\n                \"steth_discount_pct\": b.steth_discount_pct,\n                \"liquidations_eth\": b.liquidations_eth,\n                \"liquidations_steth\": b.liquidations_steth,\n                \"liquidations_total\": b.liquidations_total,\n                \"liquidated_agents_unique_cumulative\": b.liquidated_agents_unique_cumulative,\n                \"liquidation_debt_repaid_usd\": b.liquidation_debt_repaid_usd,\n                \"liquidation_debt_repaid_cumulative_usd\": b.liquidation_debt_repaid_cumulative_usd,\n                \"bad_debt_usd\": b.bad_debt_usd,\n            })\n\n    if not rows:\n        return pd.DataFrame(columns=BLOCK_RESULT_COLUMNS)\n    return pd.DataFrame(rows, columns=BLOCK_RESULT_COLUMNS)\n\n\ndef liquidation_events_to_dataframe(results: Dict[str, SimulationResult]) -> pd.DataFrame:\n    \"\"\"Consolidate liquidation events from all scenarios into a single Pandas DataFrame.\n\n    # Implements FR-09-02, SRS \u00a77.3\n\n    Args:\n        results: Dictionary mapping scenario IDs to their SimulationResult objects.\n\n    Returns:\n        DataFrame with exactly 10 standardized columns.\n    \"\"\"\n    rows: List[Dict[str, Any]] = []\n    for sc_id in sorted(results.keys()):\n        sim_res = results[sc_id]\n        for ev in sim_res.liquidation_events:\n            rows.append({\n                \"scenario\": ev.scenario,\n                \"block\": ev.block,\n                \"agent_id\": ev.agent_id,\n                \"asset\": ev.asset,\n                \"hf_before\": ev.hf_before,\n                \"debt_repaid_usd\": ev.debt_repaid_usd,\n                \"collateral_seized\": ev.collateral_seized,\n                \"collateral_value_at_oracle_usd\": ev.collateral_value_at_oracle_usd,\n                \"remaining_debt_usd\": ev.remaining_debt_usd,\n                \"remaining_collateral\": ev.remaining_collateral,\n            })\n\n    if not rows:\n        return pd.DataFrame(columns=LIQUIDATION_EVENT_COLUMNS)\n    return pd.DataFrame(rows, columns=LIQUIDATION_EVENT_COLUMNS)\n\n\ndef export_block_results_to_csv(results: Dict[str, SimulationResult]) -> str:\n    \"\"\"Export block results from all scenarios to a CSV string.\n\n    # Implements FR-09-01, FR-09-03, ST-08\n\n    Args:\n        results: Dictionary mapping scenario IDs to their SimulationResult objects.\n\n    Returns:\n        RFC 4180 compliant CSV string with header.\n    \"\"\"\n    df = block_results_to_dataframe(results)\n    return df.to_csv(index=False)\n\n\ndef export_liquidation_events_to_csv(results: Dict[str, SimulationResult]) -> str:\n    \"\"\"Export liquidation events from all scenarios to a CSV string.\n\n    # Implements FR-09-02, FR-09-03, ST-08\n\n    Args:\n        results: Dictionary mapping scenario IDs to their SimulationResult objects.\n\n    Returns:\n        RFC 4180 compliant CSV string with header.\n    \"\"\"\n    df = liquidation_events_to_dataframe(results)\n    return df.to_csv(index=False)\n\n", "src/infra/__init__.py": "\"\"\"Infrastructure and exporters.\"\"\"\n\n", "src/interface/app.py": "\"\"\"Main Streamlit Application for DeFi Liquidation Cascade Simulator.\n\n# Implements FR-10, FR-10-01..FR-10-07, NFR-06, SRS \u00a711, \u00a712, \u00a713, \u00a714, \u00a715.1\n\"\"\"\n\nfrom typing import Dict\nimport streamlit as st\nimport pandas as pd\n\nfrom src.domain.config import SimulationConfig\nfrom src.domain.simulation_result import SimulationResult\nfrom src.usecase.scenario_runner import run_all_scenarios\nfrom src.interface.theme import apply_theme\nfrom src.interface.components.sidebar import render_sidebar\nfrom src.interface.components.metrics import calculate_kpi_summary, render_kpi_metrics, generate_comparison_table\nfrom src.interface.components.charts import (\n    create_eth_price_chart,\n    create_steth_discount_chart,\n    create_liquidation_breakdown_chart,\n    create_cumulative_liquidated_agents_chart,\n)\nfrom src.interface.components.data_tab import render_data_tab\nfrom src.interface.components.methodology_tab import render_methodology_tab\n\n\ndef main() -> None:\n    \"\"\"Main Streamlit application entry point.\n\n    # Implements FR-10-01, FR-10-02, FR-10-07, NFR-06\n    \"\"\"\n    st.set_page_config(\n        page_title=\"DeFi Liquidation Cascade Simulator\",\n        layout=\"wide\",\n        initial_sidebar_state=\"expanded\",\n    )\n\n    # Apply Custom Light Theme\n    apply_theme()\n\n    # Header Container with Academic Disclaimer (FR-10-02, SRS \u00a712.3)\n    st.markdown(\n        \"\"\"\n        <div class=\"header-container\">\n            <div class=\"header-badge\">M\u00f4 h\u00ecnh Agent-Based Model</div>\n            <h1 class=\"header-title\">M\u00f4 ph\u1ecfng l\u00e2y lan r\u1ee7i ro thanh l\u00fd trong DeFi Lending</h1>\n            <p class=\"header-subtitle\">\n                Kh\u1ea3o s\u00e1t c\u01a1 ch\u1ebf l\u00e2y lan r\u1ee7i ro khi thanh l\u00fd t\u00e0i s\u1ea3n th\u1ebf ch\u1ea5p (ETH v\u00e0 stETH) t\u00e1c \u0111\u1ed9ng l\u00ean c\u00e1c pool AMM qua t\u1eebng kh\u1ed1i.\n            </p>\n            <div class=\"header-disclaimer\">\n                Ghi ch\u00fa: D\u1eef li\u1ec7u gi\u1ea3 l\u1eadp ph\u1ee5c v\u1ee5 nghi\u00ean c\u1ee9u h\u1ecdc thu\u1eadt, kh\u00f4ng ph\u1ea3i d\u1ef1 b\u00e1o th\u1ecb tr\u01b0\u1eddng th\u1ef1c t\u1ebf.\n            </div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n    # Render Sidebar and receive user controls (FR-10-04, FR-10-05, FR-10-06)\n    run_clicked, config = render_sidebar()\n\n    # Auto-initialize session state with default run on first visit (FR-10-07)\n    if \"simulation_config\" not in st.session_state or st.session_state[\"simulation_config\"] is None:\n        st.session_state[\"simulation_config\"] = config\n    if \"simulation_results\" not in st.session_state or st.session_state[\"simulation_results\"] is None:\n        with st.spinner(\"Kh\u1edfi t\u1ea1o m\u00f4 ph\u1ecfng m\u1eb7c \u0111\u1ecbnh...\"):\n            st.session_state[\"simulation_results\"] = run_all_scenarios(st.session_state[\"simulation_config\"])\n\n    if run_clicked:\n        with st.spinner(\"\u0110ang t\u00ednh to\u00e1n m\u00f4 ph\u1ecfng 3 k\u1ecbch b\u1ea3n...\"):\n            results: Dict[str, SimulationResult] = run_all_scenarios(config)\n            st.session_state[\"simulation_results\"] = results\n            st.session_state[\"simulation_config\"] = config\n        st.toast(\"Ho\u00e0n t\u1ea5t t\u00ednh to\u00e1n m\u00f4 ph\u1ecfng.\")\n\n    results: Dict[str, SimulationResult] = st.session_state[\"simulation_results\"]\n    active_config: SimulationConfig = st.session_state[\"simulation_config\"]\n\n    # Top KPI Metrics Cards (FR-07)\n    st.markdown(\n        \"\"\"\n        <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:0.6rem;\">\n            <span style=\"font-size:0.95rem; font-weight:700; color:#0F172A;\">\n                Ch\u1ec9 s\u1ed1 k\u1ecbch b\u1ea3n l\u00e2y lan (SC03 so v\u1edbi SC02)\n            </span>\n            <span style=\"font-size:0.8rem; color:#64748B;\">\u0110\u1ed9 d\u00e0i: <strong>%d kh\u1ed1i</strong> | H\u1ea1t gi\u1ed1ng: <strong>%d</strong></span>\n        </div>\n        \"\"\" % (active_config.max_blocks, active_config.seed),\n        unsafe_allow_html=True,\n    )\n    kpi_summary = calculate_kpi_summary(\n        sim_result=results[\"SC03\"],\n        total_agents=active_config.num_borrowers,\n        ref_sc02=results[\"SC02\"],\n    )\n    render_kpi_metrics(kpi_summary)\n\n    # Scenario Items Strip\n    st.markdown(\n        \"\"\"\n        <div class=\"scenarios-strip\">\n            <div class=\"scenario-item sc-01\">SC01: Baseline (\u0110\u1ed1i ch\u1ee9ng t\u0129nh)</div>\n            <div class=\"scenario-item sc-02\">SC02: Direct Shock (C\u00fa s\u1ed1c ngo\u1ea1i sinh)</div>\n            <div class=\"scenario-item sc-03\">SC03: Cascade Contagion (L\u00e2y lan thanh l\u00fd)</div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n    # 4 Main Tabs (SRS \u00a712.2)\n    tab1, tab2, tab3, tab4 = st.tabs([\n        \"Bi\u1ebfn \u0111\u1ed9ng gi\u00e1 v\u00e0 chi\u1ebft kh\u1ea5u\",\n        \"Di\u1ec5n bi\u1ebfn thanh l\u00fd\",\n        \"B\u1ea3ng d\u1eef li\u1ec7u chi ti\u1ebft\",\n        \"C\u01a1 s\u1edf ph\u01b0\u01a1ng ph\u00e1p lu\u1eadn\",\n    ])\n\n    with tab1:\n        c1, c2 = st.columns(2)\n        with c1:\n            fig_eth = create_eth_price_chart(\n                results[\"SC01\"].block_results,\n                results[\"SC02\"].block_results,\n                results[\"SC03\"].block_results,\n            )\n            st.plotly_chart(fig_eth, use_container_width=True)\n        with c2:\n            fig_discount = create_steth_discount_chart(\n                results[\"SC01\"].block_results,\n                results[\"SC02\"].block_results,\n                results[\"SC03\"].block_results,\n            )\n            st.plotly_chart(fig_discount, use_container_width=True)\n\n    with tab2:\n        c3, c4 = st.columns(2)\n        with c3:\n            fig_breakdown = create_liquidation_breakdown_chart(results[\"SC03\"].block_results)\n            st.plotly_chart(fig_breakdown, use_container_width=True)\n        with c4:\n            fig_cumulative = create_cumulative_liquidated_agents_chart(\n                results[\"SC02\"].block_results,\n                results[\"SC03\"].block_results,\n            )\n            st.plotly_chart(fig_cumulative, use_container_width=True)\n\n        st.markdown(\"### So s\u00e1nh ch\u1ec9 s\u1ed1 gi\u1eefa c\u00e1c k\u1ecbch b\u1ea3n\")\n        st.caption(\"\u0110\u1ed1i ch\u1ee9ng \u0111\u1ecbnh l\u01b0\u1ee3ng hi\u1ec7u \u1ee9ng khu\u1ebfch \u0111\u1ea1i r\u1ee7i ro t\u1eeb c\u01a1 ch\u1ebf ph\u1ea3n h\u1ed3i AMM.\")\n        comp_table = generate_comparison_table(\n            results[\"SC01\"],\n            results[\"SC02\"],\n            results[\"SC03\"],\n        )\n        df_comp = pd.DataFrame(comp_table)\n        st.dataframe(df_comp, use_container_width=True)\n\n    with tab3:\n        render_data_tab(results)\n\n    with tab4:\n        render_methodology_tab()\n\n\nif __name__ == \"__main__\":\n    main()\n", "src/interface/theme.py": "\"\"\"Theme, CSS styling, and visual design system for the Streamlit Dashboard.\n\nClean, human-centered Light Mode design inspired by Stripe, Linear, and Notion.\n\n# Implements NFR-06, SRS \u00a712\n\"\"\"\n\nimport streamlit as st\n\nBG_LIGHT = \"#FFFFFF\"\nBG_SURFACE = \"#F8FAFC\"\nBORDER_COLOR = \"#E2E8F0\"\nTEXT_PRIMARY = \"#0F172A\"\nTEXT_SECONDARY = \"#475569\"\nCOLOR_PRIMARY = \"#2563EB\"\nCOLOR_SC01 = \"#059669\"\nCOLOR_SC02 = \"#D97706\"\nCOLOR_SC03 = \"#DC2626\"\n\nCUSTOM_CSS = \"\"\"\n<style>\n    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');\n    \n    html, body, [class*=\"css\"] {\n        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;\n    }\n    code, pre {\n        font-family: 'JetBrains Mono', monospace !important;\n    }\n    \n    /* Layout & Surface */\n    .stApp {\n        background-color: #FFFFFF !important;\n        color: #0F172A !important;\n    }\n    .block-container {\n        padding-top: 1.5rem !important;\n        padding-bottom: 3rem !important;\n        max-width: 1360px !important;\n    }\n\n    /* Sidebar Styling */\n    section[data-testid=\"stSidebar\"] {\n        background-color: #F8FAFC !important;\n        border-right: 1px solid #E2E8F0 !important;\n    }\n    section[data-testid=\"stSidebar\"] .block-container {\n        padding-top: 1.5rem !important;\n        padding-left: 1.25rem !important;\n        padding-right: 1.25rem !important;\n    }\n    .sidebar-section-title {\n        font-size: 0.72rem;\n        font-weight: 700;\n        text-transform: uppercase;\n        letter-spacing: 0.06em;\n        color: #64748B;\n        margin-top: 1.15rem;\n        margin-bottom: 0.35rem;\n    }\n    section[data-testid=\"stSidebar\"] div.stButton > button {\n        min-height: 38px !important;\n        display: flex !important;\n        align-items: center !important;\n        justify-content: center !important;\n        white-space: nowrap !important;\n    }\n\n    /* Header Container */\n    .header-container {\n        background: #FFFFFF;\n        border: 1px solid #E2E8F0;\n        border-radius: 12px;\n        padding: 1.4rem 1.8rem;\n        margin-bottom: 1.25rem;\n        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);\n    }\n    .header-badge {\n        display: inline-block;\n        background: #EFF6FF;\n        border: 1px solid #BFDBFE;\n        color: #1D4ED8;\n        padding: 0.2rem 0.65rem;\n        border-radius: 6px;\n        font-size: 0.72rem;\n        font-weight: 600;\n        text-transform: uppercase;\n        letter-spacing: 0.04em;\n        margin-bottom: 0.5rem;\n    }\n    .header-title {\n        font-size: 1.75rem;\n        font-weight: 700;\n        color: #0F172A;\n        letter-spacing: -0.02em;\n        margin: 0 0 0.35rem 0;\n        line-height: 1.25;\n    }\n    .header-subtitle {\n        color: #475569;\n        font-size: 0.92rem;\n        line-height: 1.5;\n        margin: 0;\n    }\n    .header-disclaimer {\n        display: inline-block;\n        background: #F8FAFC;\n        border: 1px solid #E2E8F0;\n        color: #64748B;\n        padding: 0.35rem 0.75rem;\n        border-radius: 6px;\n        font-size: 0.78rem;\n        font-weight: 500;\n        margin-top: 0.85rem;\n    }\n\n    /* Scenario Pills */\n    .scenarios-strip {\n        display: flex;\n        flex-wrap: wrap;\n        gap: 0.6rem;\n        margin-top: 0.75rem;\n        margin-bottom: 1.25rem;\n    }\n    .scenario-item {\n        display: inline-flex;\n        align-items: center;\n        gap: 0.4rem;\n        padding: 0.35rem 0.75rem;\n        border-radius: 6px;\n        font-size: 0.78rem;\n        font-weight: 500;\n    }\n    .sc-01 { background: #ECFDF5; border: 1px solid #A7F3D0; color: #065F46; }\n    .sc-02 { background: #FFFBEB; border: 1px solid #FDE68A; color: #92400E; }\n    .sc-03 { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; }\n\n    /* KPI Cards */\n    .metric-card {\n        background: #FFFFFF;\n        border: 1px solid #E2E8F0;\n        border-radius: 10px;\n        padding: 1rem 1.15rem;\n        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);\n        transition: border-color 0.15s ease, box-shadow 0.15s ease;\n    }\n    .metric-card:hover {\n        border-color: #CBD5E1;\n        box-shadow: 0 3px 8px rgba(15, 23, 42, 0.06);\n    }\n    .metric-label {\n        font-size: 0.72rem;\n        font-weight: 600;\n        color: #64748B;\n        text-transform: uppercase;\n        letter-spacing: 0.04em;\n        margin-bottom: 0.35rem;\n    }\n    .metric-value {\n        font-family: 'JetBrains Mono', monospace;\n        font-size: 1.5rem;\n        font-weight: 700;\n        color: #0F172A;\n        letter-spacing: -0.02em;\n        line-height: 1.2;\n    }\n    .metric-delta {\n        margin-top: 0.4rem;\n        font-size: 0.74rem;\n        font-weight: 600;\n        display: inline-block;\n        padding: 0.12rem 0.45rem;\n        border-radius: 4px;\n    }\n    .delta-down { background: #FEE2E2; color: #991B1B; }\n    .delta-up { background: #D1FAE5; color: #065F46; }\n    .delta-flat { background: #F1F5F9; color: #475569; }\n\n    /* Tabs */\n    .stTabs [data-baseweb=\"tab-list\"] {\n        gap: 6px;\n        background-color: #F1F5F9 !important;\n        padding: 4px;\n        border-radius: 8px;\n        border: 1px solid #E2E8F0;\n    }\n    .stTabs [data-baseweb=\"tab\"] {\n        padding: 7px 16px !important;\n        border-radius: 6px !important;\n        color: #64748B !important;\n        font-weight: 500 !important;\n        font-size: 0.88rem !important;\n        border: none !important;\n        background-color: transparent !important;\n    }\n    .stTabs [data-baseweb=\"tab\"]:hover { color: #0F172A !important; }\n    .stTabs [aria-selected=\"true\"] {\n        background-color: #FFFFFF !important;\n        color: #0F172A !important;\n        font-weight: 600 !important;\n        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08) !important;\n    }\n\n    /* Buttons */\n    div.stButton > button {\n        border-radius: 6px !important;\n        font-weight: 500 !important;\n        font-size: 0.88rem !important;\n        padding: 0.5rem 1rem !important;\n        border: 1px solid #CBD5E1 !important;\n        background: #FFFFFF !important;\n        color: #1E293B !important;\n        transition: all 0.15s ease !important;\n    }\n    div.stButton > button:hover {\n        background: #F8FAFC !important;\n        border-color: #94A3B8 !important;\n    }\n    div.stButton > button[kind=\"primary\"] {\n        background: #2563EB !important;\n        color: #FFFFFF !important;\n        border: 1px solid #1D4ED8 !important;\n        box-shadow: 0 1px 2px rgba(37, 99, 235, 0.15) !important;\n    }\n    div.stButton > button[kind=\"primary\"]:hover {\n        background: #1D4ED8 !important;\n        box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25) !important;\n    }\n\n    /* Methodology Flow & Formula Cards */\n    .flow-container { display: flex; flex-direction: column; gap: 0.4rem; }\n    .flow-card {\n        background: #FFFFFF;\n        border: 1px solid #E2E8F0;\n        border-radius: 8px;\n        padding: 0.75rem 1rem;\n        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);\n    }\n    .flow-card-highlight { background: #FEF2F2; border-color: #FECACA; }\n    .flow-step { font-size: 0.68rem; font-weight: 700; color: #2563EB; letter-spacing: 0.04em; }\n    .flow-title { font-size: 0.88rem; font-weight: 600; color: #0F172A; margin-top: 0.15rem; }\n    .flow-desc { font-size: 0.78rem; color: #475569; margin-top: 0.25rem; line-height: 1.45; }\n    .flow-arrow { text-align: center; color: #94A3B8; font-size: 0.95rem; line-height: 1; }\n\n    .formula-card {\n        background: #FFFFFF;\n        border: 1px solid #E2E8F0;\n        border-radius: 10px;\n        padding: 0.9rem 1.15rem;\n        margin-bottom: 0.85rem;\n        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);\n    }\n    .formula-badge { font-size: 0.68rem; font-weight: 700; color: #2563EB; letter-spacing: 0.05em; margin-bottom: 0.25rem; }\n    .formula-title { font-size: 0.9rem; font-weight: 700; color: #0F172A; margin-bottom: 0.4rem; }\n    .formula-desc { font-size: 0.78rem; color: #64748B; margin-top: 0.45rem; line-height: 1.4; }\n\n    .scenario-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.85rem; }\n    .scenario-box { border-radius: 8px; padding: 0.85rem 1rem; }\n    .box-sc01 { background: #ECFDF5; border: 1px solid #A7F3D0; }\n    .box-sc02 { background: #FFFBEB; border: 1px solid #FDE68A; }\n    .box-sc03 { background: #FEF2F2; border: 1px solid #FECACA; }\n    .scenario-tag { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 0.2rem; }\n    .tag-sc01 { color: #065F46; }\n    .tag-sc02 { color: #92400E; }\n    .tag-sc03 { color: #991B1B; }\n    .scenario-name { font-size: 0.88rem; font-weight: 700; color: #0F172A; margin-bottom: 0.25rem; }\n    .scenario-body { font-size: 0.78rem; color: #475569; line-height: 1.4; }\n\n    .limitations-container {\n        background: #F8FAFC;\n        border: 1px solid #E2E8F0;\n        border-left: 4px solid #2563EB;\n        border-radius: 8px;\n        padding: 0.9rem 1.2rem;\n    }\n\n    /* Sliders & Scrollbars */\n    div[data-testid=\"stSlider\"] label { font-size: 0.8rem !important; font-weight: 600 !important; color: #334155 !important; }\n    ::-webkit-scrollbar { width: 6px; height: 6px; }\n    ::-webkit-scrollbar-track { background: #F8FAFC; }\n    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }\n    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }\n</style>\n\"\"\"\n\n\ndef apply_theme() -> None:\n    \"\"\"Inject custom CSS theme into the active Streamlit app.\"\"\"\n    st.markdown(CUSTOM_CSS, unsafe_allow_html=True)\n", "src/interface/__init__.py": "\"\"\"User interface package.\"\"\"\n\n", "src/usecase/agent_generator.py": "\"\"\"Deterministic Borrower Agent population generator.\n\n# Implements FR-001, FR-002, FR-003, FR-004, FR-005, FR-006, FR-007, FR-008\n# Implements UT-02, UT-03, UT-12\n\"\"\"\n\nimport random\nfrom typing import List\nfrom src.domain.config import SimulationConfig\nfrom src.domain.agent import BorrowerAgent, AssetType, AgentStatus\n\n\n# Initial asset spot prices (SRS \u00a710.1, Spec 002)\nINITIAL_ETH_PRICE_USD: float = 3000.0\nINITIAL_STETH_PRICE_USD: float = 2970.0  # 3000.0 * 0.99 (1% discount)\n\n\ndef generate_borrower_agents(config: SimulationConfig) -> List[BorrowerAgent]:\n    \"\"\"Generate a reproducible population of borrower agents from config.\n\n    Uses an isolated random.Random(seed) instance to guarantee that the agent\n    population is completely identical across repeated simulation runs.\n\n    Args:\n        config: Validated SimulationConfig instance.\n\n    Returns:\n        List of BorrowerAgent instances (default 100: 50 ETH and 50 stETH).\n\n    Raises:\n        ValueError: If any generated agent has initial Health Factor <= 1.0.\n    \"\"\"\n    rng = random.Random(config.seed)\n    n = config.num_borrowers\n    half = n // 2\n\n    agents: List[BorrowerAgent] = []\n\n    for agent_id in range(1, n + 1):\n        if agent_id <= half:\n            collateral_type = AssetType.ETH\n            price = INITIAL_ETH_PRICE_USD\n        else:\n            collateral_type = AssetType.STETH\n            price = INITIAL_STETH_PRICE_USD\n\n        # Draw values in fixed deterministic sequence (SRS \u00a710.1 b\u01b0\u1edbc 3)\n        collateral_usd = rng.uniform(250_000.0, 1_000_000.0)\n        initial_ltv = rng.uniform(0.55, 0.72)\n\n        collateral_amount = collateral_usd / price\n        debt_usdc = collateral_usd * initial_ltv\n\n        # Health Factor verification (FR-006)\n        hf = (collateral_amount * price * config.liquidation_threshold) / debt_usdc\n        if hf <= 1.0:\n            raise ValueError(\n                f\"L\u1ed7i sinh d\u1eef li\u1ec7u: Agent {agent_id} c\u00f3 HF <= 1 ({hf:.4f})\"\n            )\n\n        agent = BorrowerAgent(\n            agent_id=agent_id,\n            collateral_type=collateral_type,\n            collateral_amount=collateral_amount,\n            debt_usdc=debt_usdc,\n            initial_ltv=initial_ltv,\n            liquidation_threshold=config.liquidation_threshold,\n            ever_liquidated=False,\n            liquidation_count=0,\n            status=AgentStatus.ACTIVE,\n        )\n        agents.append(agent)\n\n    return agents\n\n", "src/usecase/amm_engine.py": "\"\"\"AMM pool management, swap execution, and price discovery usecases.\n\n# Implements FR-001, FR-002, FR-003, FR-004, FR-005, FR-006, FR-007, FR-008, FR-009, FR-010, FR-011, FR-012, FR-013\n# Implements BR-05, BR-06, BR-07, BR-09\n# Implements UT-09, UT-12, UT-13\n\"\"\"\n\nimport math\nfrom typing import Tuple, Dict\nfrom src.domain.config import SimulationConfig\nfrom src.domain.amm_pool import AMMPool\n\n\nINITIAL_ETH_PRICE: float = 3000.0\nINITIAL_STETH_DISCOUNT_RATIO: float = 0.99  # 1% initial discount (stETH/ETH = 0.99)\n\n\ndef initialize_pools(config: SimulationConfig) -> Tuple[AMMPool, AMMPool]:\n    \"\"\"Initialize Pool A (ETH/USDC) and Pool B (stETH/ETH) based on TVL config.\n\n    # Implements BR-06, FR-001\n\n    Pool A TVL is split 50/50 between ETH and USDC at $3,000/ETH.\n    Pool B TVL is split 50/50 in USD value between stETH ($2,970) and ETH ($3,000).\n\n    Args:\n        config: SimulationConfig containing pool_a_tvl_usd and pool_b_tvl_usd.\n\n    Returns:\n        Tuple of (pool_a, pool_b).\n    \"\"\"\n    # 1. Pool A: ETH/USDC\n    # reserve_y = USDC, reserve_x = ETH\n    pool_a_half_tvl = config.pool_a_tvl_usd / 2.0\n    reserve_a_usdc = pool_a_half_tvl\n    reserve_a_eth = pool_a_half_tvl / INITIAL_ETH_PRICE\n\n    pool_a = AMMPool(\n        name=\"ETH_USDC\",\n        token_x=\"ETH\",\n        token_y=\"USDC\",\n        reserve_x=reserve_a_eth,\n        reserve_y=reserve_a_usdc,\n    )\n\n    # 2. Pool B: stETH/ETH\n    # reserve_y = ETH, reserve_x = stETH\n    pool_b_half_tvl = config.pool_b_tvl_usd / 2.0\n    reserve_b_eth = pool_b_half_tvl / INITIAL_ETH_PRICE\n    initial_steth_usd = INITIAL_ETH_PRICE * INITIAL_STETH_DISCOUNT_RATIO  # $2,970\n    reserve_b_steth = pool_b_half_tvl / initial_steth_usd\n\n    pool_b = AMMPool(\n        name=\"STETH_ETH\",\n        token_x=\"stETH\",\n        token_y=\"ETH\",\n        reserve_x=reserve_b_steth,\n        reserve_y=reserve_b_eth,\n    )\n\n    return pool_a, pool_b\n\n\ndef swap_exact_input(pool: AMMPool, delta_x: float) -> float:\n    \"\"\"Execute a zero-fee swap depositing delta_x and returning received delta_y.\n\n    # Implements BR-05, FR-004\n\n    Args:\n        pool: AMMPool instance to execute swap on.\n        delta_x: Positive quantity of token x to sell.\n\n    Returns:\n        Quantity of token y received.\n    \"\"\"\n    return pool.sell_x(delta_x)\n\n\ndef apply_exogenous_shock(pool_a: AMMPool, shock_pct: float) -> None:\n    \"\"\"Apply exogenous price shock to Pool A at block 1 preserving invariant k_A.\n\n    # Implements BR-07, FR-009\n\n    Rebalances Pool A reserves such that spot price drops to P * (1 - shock_pct/100)\n    while k_A = reserve_x * reserve_y remains strictly invariant. Pool B is unaffected.\n\n    Args:\n        pool_a: Pool A (ETH/USDC) instance.\n        shock_pct: Percentage price drop (e.g., 15.0).\n    \"\"\"\n    if shock_pct <= 0.0:\n        return\n\n    p_after = INITIAL_ETH_PRICE * (1.0 - shock_pct / 100.0)\n    k_a = pool_a.k\n\n    new_reserve_eth = math.sqrt(k_a / p_after)\n    new_reserve_usdc = math.sqrt(k_a * p_after)\n\n    pool_a.reserve_x = new_reserve_eth\n    pool_a.reserve_y = new_reserve_usdc\n\n\ndef get_market_prices(pool_a: AMMPool, pool_b: AMMPool) -> Dict[str, float]:\n    \"\"\"Derive current market prices and stETH discount from pool reserves.\n\n    # Implements BR-09, FR-008\n\n    Returns:\n        Dict with keys:\n            - eth_price_usd: Spot price of ETH in USD.\n            - steth_eth_ratio: Price of stETH denominated in ETH.\n            - steth_price_usd: Cross spot price of stETH in USD.\n            - steth_discount_pct: stETH discount percentage (not truncated at 0).\n    \"\"\"\n    eth_price_usd = pool_a.spot_price\n    steth_eth_ratio = pool_b.spot_price\n    steth_price_usd = eth_price_usd * steth_eth_ratio\n    steth_discount_pct = (1.0 - steth_eth_ratio) * 100.0\n\n    return {\n        \"eth_price_usd\": eth_price_usd,\n        \"steth_eth_ratio\": steth_eth_ratio,\n        \"steth_price_usd\": steth_price_usd,\n        \"steth_discount_pct\": steth_discount_pct,\n    }\n\n", "src/usecase/health_factor.py": "\"\"\"Health Factor, collateral valuation, and liquidation eligibility usecases.\n\n# Implements FR-001, FR-002, FR-003, FR-004, FR-005, FR-006, FR-007, FR-008, FR-010, FR-011\n# Implements BR-01, BR-02, BR-03\n# Implements UT-04, UT-05, UT-06\n\"\"\"\n\nimport math\nfrom typing import Union\nfrom src.domain.agent import BorrowerAgent, AssetType, AgentStatus\n\n\n# Numerical tolerance for zero comparisons (FR-010, SRS \u00a78)\nEPSILON: float = 1e-9\n\n\ndef compute_collateral_value(\n    agent: BorrowerAgent,\n    eth_price_usd: float,\n    steth_price_usd: float,\n) -> float:\n    \"\"\"Calculate the USD valuation of an agent's collateral at current prices.\n\n    # Implements BR-01, FR-001, FR-008\n\n    Args:\n        agent: BorrowerAgent position.\n        eth_price_usd: Current spot price of ETH in USD (> 0).\n        steth_price_usd: Current spot price of stETH in USD (> 0).\n\n    Returns:\n        Total collateral value in USD.\n\n    Raises:\n        ValueError: If prices are non-positive or non-finite.\n    \"\"\"\n    if not (math.isfinite(eth_price_usd) and eth_price_usd > 0):\n        raise ValueError(f\"Invalid ETH price: {eth_price_usd}\")\n    if not (math.isfinite(steth_price_usd) and steth_price_usd > 0):\n        raise ValueError(f\"Invalid stETH price: {steth_price_usd}\")\n\n    if agent.collateral_type == AssetType.ETH:\n        price = eth_price_usd\n    else:\n        price = steth_price_usd\n\n    return agent.collateral_amount * price\n\n\ndef compute_current_ltv(\n    debt_usdc: float,\n    collateral_value_usd: float,\n) -> float:\n    \"\"\"Calculate current Loan-To-Value ratio.\n\n    # Implements BR-02, FR-002, FR-003\n\n    Args:\n        debt_usdc: Outstanding borrow debt in USDC.\n        collateral_value_usd: Current collateral valuation in USD.\n\n    Returns:\n        Current LTV as float, or math.inf if debt > 0 and collateral = 0.\n    \"\"\"\n    if collateral_value_usd <= EPSILON:\n        if debt_usdc > EPSILON:\n            return math.inf\n        return 0.0\n\n    return debt_usdc / collateral_value_usd\n\n\ndef compute_health_factor(\n    collateral_value_usd: float,\n    debt_usdc: float,\n    liquidation_threshold: float = 0.80,\n) -> float:\n    \"\"\"Calculate Health Factor with safe edge-case handling.\n\n    # Implements BR-03, FR-004, FR-005\n\n    HF = (collateral_value_usd * liquidation_threshold) / debt_usdc\n\n    Rules:\n        - If debt <= epsilon: HF = +inf (safe, no debt).\n        - If collateral <= epsilon and debt > epsilon: HF = 0.0 (bad debt).\n\n    Args:\n        collateral_value_usd: Current collateral value in USD.\n        debt_usdc: Outstanding debt in USDC.\n        liquidation_threshold: Liquidation threshold ratio (default 0.80).\n\n    Returns:\n        Health Factor as float.\n    \"\"\"\n    if debt_usdc <= EPSILON:\n        return math.inf\n\n    if collateral_value_usd <= EPSILON:\n        return 0.0\n\n    return (collateral_value_usd * liquidation_threshold) / debt_usdc\n\n\ndef is_liquidatable(\n    agent: BorrowerAgent,\n    eth_price_usd: float,\n    steth_price_usd: float,\n    liquidation_threshold: float = 0.80,\n) -> bool:\n    \"\"\"Determine whether an agent position is eligible for liquidation.\n\n    # Implements FR-006, FR-007, FR-011\n\n    Eligible if:\n        - Status is ACTIVE (not REPAID or BAD_DEBT)\n        - debt_usdc > epsilon\n        - collateral_amount > epsilon\n        - HF < 1.0 (strict inequality; HF >= 1.0 is NOT eligible)\n\n    Args:\n        agent: BorrowerAgent position.\n        eth_price_usd: Current spot price of ETH in USD.\n        steth_price_usd: Current spot price of stETH in USD.\n        liquidation_threshold: Protocol threshold ratio (default 0.80).\n\n    Returns:\n        True if eligible for partial liquidation, False otherwise.\n    \"\"\"\n    if agent.status in (AgentStatus.REPAID, AgentStatus.BAD_DEBT):\n        return False\n\n    if agent.debt_usdc <= EPSILON:\n        return False\n\n    if agent.collateral_amount <= EPSILON:\n        return False\n\n    collateral_val = compute_collateral_value(agent, eth_price_usd, steth_price_usd)\n    hf = compute_health_factor(collateral_val, agent.debt_usdc, liquidation_threshold)\n\n    return hf < 1.0\n\n", "src/usecase/liquidation_engine.py": "\"\"\"Partial liquidation engine and bad debt calculation usecases.\n\n# Implements FR-001, FR-002, FR-003, FR-004, FR-005, FR-006, FR-007, FR-008, FR-009, FR-010, FR-011, FR-012, FR-013\n# Implements BR-04, BR-10, BR-11\n# Implements UT-07, UT-08\n\"\"\"\n\nfrom typing import Optional, List\nfrom src.domain.agent import BorrowerAgent, AgentStatus\nfrom src.domain.liquidation_event import LiquidationEvent\nfrom src.usecase.health_factor import EPSILON\n\n\ndef liquidate_borrower_position(\n    agent: BorrowerAgent,\n    scenario: str,\n    block: int,\n    spot_price_usd: float,\n    close_factor: float = 0.50,\n    liquidation_penalty: float = 0.05,\n) -> Optional[LiquidationEvent]:\n    \"\"\"Execute partial liquidation on an eligible borrower agent position.\n\n    # Implements BR-04, BR-11\n\n    Algorithm:\n        1. Calculate candidate repayment = close_factor * debt_usdc.\n        2. Calculate maximum debt repayable supported by available collateral\n           = (collateral_amount * spot_price_usd) / (1.0 + liquidation_penalty).\n        3. debt_repaid = min(candidate_repay, max_repay_from_collateral).\n        4. If debt_repaid <= EPSILON, abort (return None).\n        5. collateral_seized = min(collateral_amount, debt_repaid * (1 + penalty) / spot_price_usd).\n        6. Apply updates to agent state.\n        7. Return LiquidationEvent with pre-trade spot values.\n\n    Args:\n        agent: BorrowerAgent position to liquidate.\n        scenario: Scenario identifier (\"SC02\" or \"SC03\").\n        block: Current simulation block number.\n        spot_price_usd: Pre-trade spot price of collateral asset in USD.\n        close_factor: Maximum portion of debt repayable (default 0.50).\n        liquidation_penalty: Bonus collateral incentive (default 0.05).\n\n    Returns:\n        LiquidationEvent if liquidation executed, or None if not eligible/aborted.\n    \"\"\"\n    if agent.status in (AgentStatus.REPAID, AgentStatus.BAD_DEBT):\n        return None\n\n    if agent.debt_usdc <= EPSILON or agent.collateral_amount <= EPSILON:\n        return None\n\n    # Compute HF immediately before trade\n    collateral_val_usd = agent.collateral_amount * spot_price_usd\n    hf_before = (collateral_val_usd * agent.liquidation_threshold) / agent.debt_usdc\n\n    # Liquidation requires HF < 1.0 (strict inequality)\n    if hf_before >= 1.0:\n        return None\n\n    # Step 1: Candidate repayment capped by close factor\n    candidate_repay = close_factor * agent.debt_usdc\n\n    # Step 2: Maximum repayment supported by current collateral with penalty bonus\n    max_repay_from_collateral = collateral_val_usd / (1.0 + liquidation_penalty)\n\n    # Step 3: Actual debt repaid\n    debt_repaid = min(candidate_repay, max_repay_from_collateral)\n\n    # Step 4: Abort if debt repaid is negligible\n    if debt_repaid <= EPSILON:\n        return None\n\n    # Step 5: Quantity of collateral seized\n    collateral_seized = min(\n        agent.collateral_amount,\n        (debt_repaid * (1.0 + liquidation_penalty)) / spot_price_usd,\n    )\n    collateral_val_oracle = collateral_seized * spot_price_usd\n\n    # Step 6: Apply liquidation on agent\n    agent.apply_liquidation(debt_repaid, collateral_seized)\n\n    # Step 7: Record and return LiquidationEvent\n    return LiquidationEvent(\n        scenario=scenario,\n        block=block,\n        agent_id=agent.agent_id,\n        asset=agent.collateral_type.value,\n        hf_before=hf_before,\n        debt_repaid_usd=debt_repaid,\n        collateral_seized=collateral_seized,\n        collateral_value_at_oracle_usd=collateral_val_oracle,\n        remaining_debt_usd=agent.debt_usdc,\n        remaining_collateral=agent.collateral_amount,\n    )\n\n\ndef compute_total_bad_debt(agents: List[BorrowerAgent]) -> float:\n    \"\"\"Aggregate total outstanding bad debt across all borrower agent positions.\n\n    # Implements BR-10, FR-009\n\n    Bad debt is defined as debt of positions where collateral is depleted\n    (collateral <= EPSILON) but debt remains (debt > EPSILON). Computed from\n    current snapshot state.\n\n    Args:\n        agents: List of all borrower agents in the simulation.\n\n    Returns:\n        Sum of bad debt in USD/USDC.\n    \"\"\"\n    total = 0.0\n    for agent in agents:\n        if agent.collateral_amount <= EPSILON and agent.debt_usdc > EPSILON:\n            total += agent.debt_usdc\n    return total\n\n", "src/usecase/scenario_runner.py": "\"\"\"Scenario simulation runner coordinating SC01, SC02, and SC03 block loops.\n\n# Implements FR-001, FR-002, FR-003, FR-004, FR-005, FR-006, FR-007, FR-008, FR-009, FR-010, FR-011, FR-012, FR-013, FR-014, FR-015, FR-016, FR-017, FR-018, FR-019, FR-020\n# Implements BR-07, BR-08, BR-10, BR-11, SRS \u00a79, \u00a710, \u00a715.1\n\"\"\"\n\nimport copy\nfrom typing import Dict, List, Set\nfrom src.domain.config import SimulationConfig\nfrom src.domain.agent import BorrowerAgent, AssetType\nfrom src.domain.amm_pool import AMMPool\nfrom src.domain.block_result import BlockResult\nfrom src.domain.liquidation_event import LiquidationEvent\nfrom src.domain.simulation_result import KPISummary, SimulationResult\nfrom src.usecase.agent_generator import generate_borrower_agents\nfrom src.usecase.amm_engine import (\n    initialize_pools,\n    swap_exact_input,\n    apply_exogenous_shock,\n    get_market_prices,\n)\nfrom src.usecase.health_factor import is_liquidatable, EPSILON\nfrom src.usecase.liquidation_engine import (\n    liquidate_borrower_position,\n    compute_total_bad_debt,\n)\n\n\ndef run_scenario(\n    scenario_id: str,\n    config: SimulationConfig,\n    agents: List[BorrowerAgent],\n    pool_a: AMMPool,\n    pool_b: AMMPool,\n) -> SimulationResult:\n    \"\"\"Run a discrete block-by-block simulation for a single scenario.\n\n    # Implements SRS \u00a710, BR-07, BR-08, BR-11\n\n    Args:\n        scenario_id: \"SC01\" (Baseline), \"SC02\" (Direct Shock), or \"SC03\" (Contagion).\n        config: SimulationConfig instance.\n        agents: Independent copy of initial borrower agent positions.\n        pool_a: Independent copy of initial Pool A (ETH/USDC).\n        pool_b: Independent copy of initial Pool B (stETH/ETH).\n\n    Returns:\n        SimulationResult containing exactly max_blocks + 1 BlockResult records.\n    \"\"\"\n    block_results: List[BlockResult] = []\n    all_events: List[LiquidationEvent] = []\n    cumulative_debt_repaid: float = 0.0\n    liquidated_agent_ids: Set[int] = set()\n\n    for block in range(config.max_blocks + 1):\n        if block == 0:\n            # Block 0: Snapshot initial undisturbed market state (SRS \u00a710.1)\n            prices = get_market_prices(pool_a, pool_b)\n            b0 = BlockResult(\n                scenario=scenario_id,\n                block=0,\n                eth_price_usd=prices[\"eth_price_usd\"],\n                steth_price_usd=prices[\"steth_price_usd\"],\n                steth_discount_pct=prices[\"steth_discount_pct\"],\n                liquidations_eth=0,\n                liquidations_steth=0,\n                liquidations_total=0,\n                liquidated_agents_unique_cumulative=0,\n                liquidation_debt_repaid_usd=0.0,\n                liquidation_debt_repaid_cumulative_usd=0.0,\n                bad_debt_usd=0.0,\n            )\n            block_results.append(b0)\n            continue\n\n        # Block >= 1:\n        # Step a: Apply exogenous shock at block 1 once (SC02, SC03 only)\n        if block == 1 and scenario_id in (\"SC02\", \"SC03\"):\n            apply_exogenous_shock(pool_a, config.shock_pct)\n\n        # Step b: Determine candidates at start of block sorted by agent_id\n        cur_prices = get_market_prices(pool_a, pool_b)\n        candidates = [\n            a\n            for a in agents\n            if is_liquidatable(\n                a,\n                cur_prices[\"eth_price_usd\"],\n                cur_prices[\"steth_price_usd\"],\n                config.liquidation_threshold,\n            )\n        ]\n        candidates.sort(key=lambda a: a.agent_id)\n\n        # Step c: Process each candidate position\n        block_debt_repaid: float = 0.0\n        block_liq_eth: int = 0\n        block_liq_steth: int = 0\n\n        for agent in candidates:\n            # Re-check eligibility with pre-trade spot prices (FR-008, BR-11)\n            spot_prices = get_market_prices(pool_a, pool_b)\n            if not is_liquidatable(\n                agent,\n                spot_prices[\"eth_price_usd\"],\n                spot_prices[\"steth_price_usd\"],\n                config.liquidation_threshold,\n            ):\n                continue\n\n            agent_price = (\n                spot_prices[\"eth_price_usd\"]\n                if agent.collateral_type == AssetType.ETH\n                else spot_prices[\"steth_price_usd\"]\n            )\n\n            event = liquidate_borrower_position(\n                agent=agent,\n                scenario=scenario_id,\n                block=block,\n                spot_price_usd=agent_price,\n                close_factor=config.close_factor,\n                liquidation_penalty=config.liquidation_penalty,\n            )\n\n            if event is not None:\n                all_events.append(event)\n                block_debt_repaid += event.debt_repaid_usd\n                liquidated_agent_ids.add(agent.agent_id)\n\n                if event.asset == AssetType.ETH.value:\n                    block_liq_eth += 1\n                else:\n                    block_liq_steth += 1\n\n                # Step c (Selling Route for SC03): Feedback collateral into AMMs (BR-08)\n                if scenario_id == \"SC03\" and event.collateral_seized > EPSILON:\n                    if event.asset == AssetType.ETH.value:\n                        # Dump ETH into Pool A\n                        swap_exact_input(pool_a, event.collateral_seized)\n                    elif event.asset == AssetType.STETH.value:\n                        # Dump stETH into Pool B to get ETH, then dump all received ETH into Pool A\n                        eth_received = swap_exact_input(pool_b, event.collateral_seized)\n                        if eth_received > EPSILON:\n                            swap_exact_input(pool_a, eth_received)\n\n        # Step d: Record end-of-block market results\n        cumulative_debt_repaid += block_debt_repaid\n        end_prices = get_market_prices(pool_a, pool_b)\n        current_bad_debt = compute_total_bad_debt(agents)\n\n        br = BlockResult(\n            scenario=scenario_id,\n            block=block,\n            eth_price_usd=end_prices[\"eth_price_usd\"],\n            steth_price_usd=end_prices[\"steth_price_usd\"],\n            steth_discount_pct=end_prices[\"steth_discount_pct\"],\n            liquidations_eth=block_liq_eth,\n            liquidations_steth=block_liq_steth,\n            liquidations_total=block_liq_eth + block_liq_steth,\n            liquidated_agents_unique_cumulative=len(liquidated_agent_ids),\n            liquidation_debt_repaid_usd=block_debt_repaid,\n            liquidation_debt_repaid_cumulative_usd=cumulative_debt_repaid,\n            bad_debt_usd=current_bad_debt,\n        )\n        block_results.append(br)\n\n    # Compile overall KPI summary (FR-018)\n    final_br = block_results[-1]\n    summary = KPISummary(\n        scenario_id=scenario_id,\n        final_eth_price_usd=final_br.eth_price_usd,\n        final_steth_price_usd=final_br.steth_price_usd,\n        final_steth_discount_pct=final_br.steth_discount_pct,\n        liquidated_agents_unique=len(liquidated_agent_ids),\n        total_agents=len(agents),\n        liquidated_agents_ratio_pct=(len(liquidated_agent_ids) / len(agents)) * 100.0,\n        liquidation_events_total=len(all_events),\n        total_debt_repaid_usd=cumulative_debt_repaid,\n        bad_debt_usd=final_br.bad_debt_usd,\n    )\n\n    return SimulationResult(\n        scenario_id=scenario_id,\n        parameters=config,\n        block_results=block_results,\n        liquidation_events=all_events,\n        summary=summary,\n    )\n\n\ndef run_all_scenarios(config: SimulationConfig) -> Dict[str, SimulationResult]:\n    \"\"\"Integration API contract: Run SC01, SC02, and SC03 from identical initial state.\n\n    # Implements SRS \u00a715.1, FR-001, FR-003, FR-004\n\n    Args:\n        config: Validated SimulationConfig instance.\n\n    Returns:\n        Dict mapping scenario_id (\"SC01\", \"SC02\", \"SC03\") to SimulationResult.\n    \"\"\"\n    # 1. Generate base population and initial AMM pools once\n    base_agents = generate_borrower_agents(config)\n    base_pool_a, base_pool_b = initialize_pools(config)\n\n    # 2. Execute each scenario with deepcopied independent state\n    sc01 = run_scenario(\n        \"SC01\",\n        config,\n        copy.deepcopy(base_agents),\n        copy.deepcopy(base_pool_a),\n        copy.deepcopy(base_pool_b),\n    )\n\n    sc02 = run_scenario(\n        \"SC02\",\n        config,\n        copy.deepcopy(base_agents),\n        copy.deepcopy(base_pool_a),\n        copy.deepcopy(base_pool_b),\n    )\n\n    sc03_raw = run_scenario(\n        \"SC03\",\n        config,\n        copy.deepcopy(base_agents),\n        copy.deepcopy(base_pool_a),\n        copy.deepcopy(base_pool_b),\n    )\n\n    # 3. Calculate deltas for SC03 vs SC02 (FR-11, FR-07)\n    delta_eth = sc03_raw.summary.final_eth_price_usd - sc02.summary.final_eth_price_usd\n    delta_steth = sc03_raw.summary.final_steth_price_usd - sc02.summary.final_steth_price_usd\n    delta_discount = sc03_raw.summary.final_steth_discount_pct - sc02.summary.final_steth_discount_pct\n    delta_unique = sc03_raw.summary.liquidated_agents_unique - sc02.summary.liquidated_agents_unique\n    delta_events = sc03_raw.summary.liquidation_events_total - sc02.summary.liquidation_events_total\n    delta_bad_debt = sc03_raw.summary.bad_debt_usd - sc02.summary.bad_debt_usd\n\n    sc03_summary = KPISummary(\n        scenario_id=sc03_raw.summary.scenario_id,\n        final_eth_price_usd=sc03_raw.summary.final_eth_price_usd,\n        final_steth_price_usd=sc03_raw.summary.final_steth_price_usd,\n        final_steth_discount_pct=sc03_raw.summary.final_steth_discount_pct,\n        liquidated_agents_unique=sc03_raw.summary.liquidated_agents_unique,\n        total_agents=sc03_raw.summary.total_agents,\n        liquidated_agents_ratio_pct=sc03_raw.summary.liquidated_agents_ratio_pct,\n        liquidation_events_total=sc03_raw.summary.liquidation_events_total,\n        total_debt_repaid_usd=sc03_raw.summary.total_debt_repaid_usd,\n        bad_debt_usd=sc03_raw.summary.bad_debt_usd,\n        delta_eth_price_usd=delta_eth,\n        delta_steth_price_usd=delta_steth,\n        delta_steth_discount_pct=delta_discount,\n        delta_liquidated_agents=delta_unique,\n        delta_liquidation_events=delta_events,\n        delta_bad_debt_usd=delta_bad_debt,\n    )\n\n    sc03 = SimulationResult(\n        scenario_id=sc03_raw.scenario_id,\n        parameters=sc03_raw.parameters,\n        block_results=sc03_raw.block_results,\n        liquidation_events=sc03_raw.liquidation_events,\n        summary=sc03_summary,\n    )\n\n    return {\"SC01\": sc01, \"SC02\": sc02, \"SC03\": sc03}\n\n", "src/usecase/__init__.py": "\"\"\"Usecase and business engines.\"\"\"\n\n", "src/interface/components/charts.py": "\"\"\"Charts & Visualizations component using Plotly.\n\nGenerates 4 interactive charts for DeFi liquidation cascade analysis\nwith clean, light-mode financial layout.\n\n# Implements FR-08, FR-08-01..FR-08-06, SRS \u00a711, \u00a714.4\n\"\"\"\n\nfrom typing import List, Dict, Any\nimport plotly.graph_objects as go\nfrom src.domain.block_result import BlockResult\n\n# Color palette with clear distinction, warm financial aesthetic, and high contrast\nCOLOR_SC01 = \"#059669\"   # Emerald green (Baseline / Stable)\nCOLOR_SC02 = \"#D97706\"   # Amber orange (Direct shock)\nCOLOR_SC03 = \"#DC2626\"   # Crimson red (Cascade contagion)\nCOLOR_ETH = \"#2563EB\"    # Classic Royal Blue (ETH Collateral)\nCOLOR_STETH = \"#F59E0B\"  # Warm Amber Gold (stETH Collateral)\n\n\ndef _add_shock_line(fig: go.Figure) -> None:\n    \"\"\"Add a vertical dashed line and annotation at block 1 marking the price shock.\n\n    # Implements FR-08-03\n    \"\"\"\n    fig.add_vline(\n        x=1, line_width=1.5, line_dash=\"dash\", line_color=\"#D97706\",\n        annotation_text=\" C\u00fa s\u1ed1c B1 \", annotation_position=\"bottom right\",\n        annotation_font_size=10, annotation_font_color=\"#92400E\",\n        annotation=dict(bgcolor=\"rgba(254, 243, 199, 0.9)\", bordercolor=\"#FDE68A\", borderwidth=1, borderpad=3, yshift=12),\n    )\n\n\ndef _apply_chart_theme(fig: go.Figure, title: str, y_title: str, **kwargs: Any) -> None:\n    \"\"\"Apply clean light mode layout styling to a Plotly figure.\"\"\"\n    yaxis_dict = dict(showgrid=True, gridcolor=\"#F1F5F9\", zerolinecolor=\"#E2E8F0\", tickfont=dict(size=11, color=\"#64748B\"))\n    if \"yaxis\" in kwargs:\n        yaxis_dict.update(kwargs.pop(\"yaxis\"))\n\n    fig.update_layout(\n        title=dict(text=title, font=dict(size=13, color=\"#0F172A\", family=\"Plus Jakarta Sans, sans-serif\"), x=0.01, xanchor=\"left\", y=0.96),\n        xaxis_title=dict(text=\"Block\", font=dict(size=11, color=\"#64748B\")),\n        yaxis_title=dict(text=y_title, font=dict(size=11, color=\"#64748B\")),\n        paper_bgcolor=\"rgba(0,0,0,0)\",\n        plot_bgcolor=\"#FFFFFF\",\n        font=dict(family=\"Plus Jakarta Sans, sans-serif\", color=\"#475569\"),\n        hovermode=\"x unified\",\n        legend=dict(orientation=\"h\", yanchor=\"bottom\", y=1.04, xanchor=\"right\", x=1.0, font=dict(color=\"#334155\", size=10.5)),\n        xaxis=dict(showgrid=True, gridcolor=\"#F1F5F9\", zerolinecolor=\"#E2E8F0\", tickmode=\"auto\", nticks=10, tickangle=0, tickformat=\"d\", tickfont=dict(size=11, color=\"#64748B\")),\n        yaxis=yaxis_dict,\n        margin=dict(l=55, r=25, t=65, b=45),\n        modebar=dict(bgcolor=\"rgba(0,0,0,0)\", color=\"#94A3B8\"),\n        **kwargs,\n    )\n\n\n# Alias for backward compatibility if needed\n_apply_dark_theme = _apply_chart_theme\n\n\ndef create_eth_price_chart(\n    sc01_blocks: List[BlockResult],\n    sc02_blocks: List[BlockResult],\n    sc03_blocks: List[BlockResult],\n) -> go.Figure:\n    \"\"\"Create interactive line chart comparing ETH prices across 3 scenarios.\n\n    # Implements FR-08-01, FR-08-02, SRS \u00a714.4\n    \"\"\"\n    fig = go.Figure()\n\n    if sc01_blocks:\n        fig.add_trace(go.Scatter(\n            x=[b.block for b in sc01_blocks],\n            y=[b.eth_price_usd for b in sc01_blocks],\n            mode=\"lines+markers\",\n            name=\"SC01: Baseline\",\n            line=dict(color=COLOR_SC01, width=2.5),\n            marker=dict(size=4),\n            hovertemplate=\"Block %{x}: $%{y:,.2f}<extra>SC01</extra>\",\n        ))\n\n    if sc02_blocks:\n        fig.add_trace(go.Scatter(\n            x=[b.block for b in sc02_blocks],\n            y=[b.eth_price_usd for b in sc02_blocks],\n            mode=\"lines+markers\",\n            name=\"SC02: Direct Shock\",\n            line=dict(color=COLOR_SC02, width=2.5),\n            marker=dict(size=4),\n            hovertemplate=\"Block %{x}: $%{y:,.2f}<extra>SC02</extra>\",\n        ))\n\n    if sc03_blocks:\n        fig.add_trace(go.Scatter(\n            x=[b.block for b in sc03_blocks],\n            y=[b.eth_price_usd for b in sc03_blocks],\n            mode=\"lines+markers\",\n            name=\"SC03: Cascade Contagion\",\n            line=dict(color=COLOR_SC03, width=3),\n            marker=dict(size=5),\n            hovertemplate=\"Block %{x}: $%{y:,.2f}<extra>SC03</extra>\",\n        ))\n\n    _add_shock_line(fig)\n    _apply_chart_theme(\n        fig=fig,\n        title=\"Bi\u1ebfn \u0111\u1ed9ng gi\u00e1 ETH theo Block\",\n        y_title=\"ETH Price (USD)\",\n        yaxis=dict(tickprefix=\"$\", tickformat=\",d\", nticks=6, showgrid=True, gridcolor=\"#F1F5F9\"),\n    )\n    return fig\n\n\ndef create_steth_discount_chart(\n    sc01_blocks: List[BlockResult],\n    sc02_blocks: List[BlockResult],\n    sc03_blocks: List[BlockResult],\n) -> go.Figure:\n    \"\"\"Create interactive line chart of stETH discount/depeg percentage.\n\n    # Implements FR-08-01, FR-08-02, SRS \u00a714.4\n    \"\"\"\n    fig = go.Figure()\n\n    if sc01_blocks:\n        fig.add_trace(go.Scatter(\n            x=[b.block for b in sc01_blocks],\n            y=[b.steth_discount_pct for b in sc01_blocks],\n            mode=\"lines+markers\",\n            name=\"SC01: Baseline\",\n            line=dict(color=COLOR_SC01, width=2),\n            marker=dict(size=4),\n            hovertemplate=\"Block %{x}: %{y:.2f}%<extra>SC01</extra>\",\n        ))\n\n    if sc02_blocks:\n        fig.add_trace(go.Scatter(\n            x=[b.block for b in sc02_blocks],\n            y=[b.steth_discount_pct for b in sc02_blocks],\n            mode=\"lines+markers\",\n            name=\"SC02: Direct Shock\",\n            line=dict(color=COLOR_SC02, width=2),\n            marker=dict(size=4),\n            hovertemplate=\"Block %{x}: %{y:.2f}%<extra>SC02</extra>\",\n        ))\n\n    if sc03_blocks:\n        fig.add_trace(go.Scatter(\n            x=[b.block for b in sc03_blocks],\n            y=[b.steth_discount_pct for b in sc03_blocks],\n            mode=\"lines+markers\",\n            name=\"SC03: Cascade Contagion\",\n            line=dict(color=COLOR_SC03, width=3),\n            marker=dict(size=5),\n            hovertemplate=\"Block %{x}: %{y:.2f}%<extra>SC03</extra>\",\n        ))\n\n    _add_shock_line(fig)\n    _apply_chart_theme(\n        fig=fig,\n        title=\"T\u1ec9 l\u1ec7 chi\u1ebft kh\u1ea5u stETH so v\u1edbi ETH\",\n        y_title=\"stETH Discount vs ETH (%)\",\n        yaxis=dict(ticksuffix=\"%\", tickformat=\".0f\", nticks=6, showgrid=True, gridcolor=\"#F1F5F9\"),\n    )\n    return fig\n\n\ndef create_liquidation_breakdown_chart(sc03_blocks: List[BlockResult]) -> go.Figure:\n    \"\"\"Create stacked bar chart showing liquidation events by asset type in SC03.\n\n    # Implements FR-08-01, FR-08-02, SRS \u00a714.4\n    \"\"\"\n    fig = go.Figure()\n\n    if sc03_blocks:\n        blocks = [b.block for b in sc03_blocks]\n        eth_liqs = [b.liquidations_eth for b in sc03_blocks]\n        steth_liqs = [b.liquidations_steth for b in sc03_blocks]\n\n        fig.add_trace(go.Bar(\n            x=blocks,\n            y=eth_liqs,\n            name=\"ETH Liquidations\",\n            marker=dict(\n                color=COLOR_ETH,\n                line=dict(color=\"#1D4ED8\", width=0.8),\n            ),\n            hovertemplate=\"Block %{x}: %{y} ETH events<extra></extra>\",\n        ))\n        fig.add_trace(go.Bar(\n            x=blocks,\n            y=steth_liqs,\n            name=\"stETH Liquidations\",\n            marker=dict(\n                color=COLOR_STETH,\n                line=dict(color=\"#D97706\", width=0.8),\n            ),\n            hovertemplate=\"Block %{x}: %{y} stETH events<extra></extra>\",\n        ))\n\n    _apply_chart_theme(\n        fig=fig,\n        title=\"Ph\u00e2n b\u1ed5 s\u1ef1 ki\u1ec7n thanh l\u00fd theo t\u00e0i s\u1ea3n (SC03)\",\n        y_title=\"S\u1ed1 s\u1ef1 ki\u1ec7n thanh l\u00fd\",\n        barmode=\"stack\",\n        yaxis=dict(rangemode=\"tozero\", tickformat=\"d\", nticks=6, showgrid=True, gridcolor=\"#F1F5F9\"),\n    )\n    return fig\n\n\ndef create_cumulative_liquidated_agents_chart(\n    sc02_blocks: List[BlockResult],\n    sc03_blocks: List[BlockResult],\n) -> go.Figure:\n    \"\"\"Create line chart comparing cumulative unique liquidated agents (SC02 vs SC03).\n\n    # Implements FR-08-01, FR-08-02, SRS \u00a714.4\n    \"\"\"\n    fig = go.Figure()\n\n    if sc02_blocks:\n        fig.add_trace(go.Scatter(\n            x=[b.block for b in sc02_blocks],\n            y=[b.liquidated_agents_unique_cumulative for b in sc02_blocks],\n            mode=\"lines+markers\",\n            name=\"SC02: Direct Shock\",\n            line=dict(color=COLOR_SC02, width=2.5, shape=\"hv\"),\n            marker=dict(size=4),\n            hovertemplate=\"Block %{x}: %{y} agents<extra>SC02</extra>\",\n        ))\n\n    if sc03_blocks:\n        fig.add_trace(go.Scatter(\n            x=[b.block for b in sc03_blocks],\n            y=[b.liquidated_agents_unique_cumulative for b in sc03_blocks],\n            mode=\"lines+markers\",\n            name=\"SC03: Cascade Contagion\",\n            line=dict(color=COLOR_SC03, width=3, shape=\"hv\"),\n            marker=dict(size=5),\n            hovertemplate=\"Block %{x}: %{y} agents<extra>SC03</extra>\",\n        ))\n\n    _apply_chart_theme(\n        fig=fig,\n        title=\"S\u1ed1 l\u01b0\u1ee3ng ng\u01b0\u1eddi vay b\u1ecb thanh l\u00fd l\u0169y k\u1ebf\",\n        y_title=\"S\u1ed1 ng\u01b0\u1eddi vay b\u1ecb thanh l\u00fd l\u0169y k\u1ebf\",\n        yaxis=dict(rangemode=\"tozero\", tickformat=\"d\", nticks=6, showgrid=True, gridcolor=\"#F1F5F9\"),\n    )\n    return fig\n", "src/interface/components/data_tab.py": "\"\"\"Data Tab Component for Streamlit Dashboard.\n\nDisplays interactive DataFrames for Block Results (12 columns) and Liquidation Events (10 columns),\nand provides CSV download buttons.\n\n# Implements FR-09, FR-09-01..FR-09-07, SRS \u00a77.3, \u00a77.4, \u00a711, \u00a715.1\n\"\"\"\n\nfrom typing import Dict, Optional\nimport streamlit as st\nfrom src.domain.simulation_result import SimulationResult\nfrom src.infra.exporter import (\n    block_results_to_dataframe,\n    liquidation_events_to_dataframe,\n    export_block_results_to_csv,\n    export_liquidation_events_to_csv,\n)\n\n\ndef render_data_tab(results: Optional[Dict[str, SimulationResult]]) -> None:\n    \"\"\"Render the Data Tab in Streamlit with interactive tables and download buttons.\n\n    # Implements FR-09, FR-09-06, FR-09-07\n\n    Args:\n        results: Dictionary mapping scenario IDs to SimulationResult objects,\n                 or None if simulation has not run yet.\n    \"\"\"\n    if not results:\n        st.info(\"Ch\u01b0a c\u00f3 d\u1eef li\u1ec7u. Vui l\u00f2ng b\u1ea5m 'Ch\u1ea1y m\u00f4 ph\u1ecfng' \u1edf thanh b\u00ean \u0111\u1ec3 b\u1eaft \u0111\u1ea7u.\")\n        return\n\n    st.markdown(\"### D\u1eef li\u1ec7u chi ti\u1ebft t\u1eebng kh\u1ed1i (Block Results)\")\n    st.caption(\"12 tr\u01b0\u1eddng d\u1eef li\u1ec7u chu\u1ea9n theo t\u1eebng kh\u1ed1i c\u1ee7a 3 k\u1ecbch b\u1ea3n SC01, SC02, SC03.\")\n\n    df_blocks = block_results_to_dataframe(results)\n    st.dataframe(df_blocks, use_container_width=True, height=320)\n\n    csv_blocks = export_block_results_to_csv(results)\n    st.download_button(\n        label=\"T\u1ea3i t\u1ec7p CSV Block Results\",\n        data=csv_blocks,\n        file_name=\"block_results.csv\",\n        mime=\"text/csv\",\n        key=\"btn_download_block_results\",\n    )\n\n    st.markdown(\"---\")\n\n    st.markdown(\"### Danh s\u00e1ch s\u1ef1 ki\u1ec7n thanh l\u00fd (Liquidation Events)\")\n    st.caption(\"To\u00e0n b\u1ed9 c\u00e1c s\u1ef1 ki\u1ec7n thanh l\u00fd v\u1ecb th\u1ebf n\u1ee3 \u0111\u01b0\u1ee3c k\u00edch ho\u1ea1t v\u00e0 th\u1ef1c thi qua t\u1eebng kh\u1ed1i.\")\n\n    df_events = liquidation_events_to_dataframe(results)\n    if len(df_events) == 0:\n        st.info(\"Kh\u00f4ng c\u00f3 s\u1ef1 ki\u1ec7n thanh l\u00fd n\u00e0o \u0111\u01b0\u1ee3c ghi nh\u1eadn.\")\n    else:\n        st.dataframe(df_events, use_container_width=True, height=280)\n\n    csv_events = export_liquidation_events_to_csv(results)\n    st.download_button(\n        label=\"T\u1ea3i t\u1ec7p CSV Liquidation Events\",\n        data=csv_events,\n        file_name=\"liquidation_events.csv\",\n        mime=\"text/csv\",\n        key=\"btn_download_liquidation_events\",\n    )\n", "src/interface/components/methodology_tab.py": "\"\"\"Methodology Tab Component for Streamlit Dashboard.\n\nPresents academic background, visual contagion flow pipeline, mathematical formula cards,\nscenario benchmark objectives, and research limitations.\n\n# Implements FR-10, FR-10-03, SRS \u00a74.3, \u00a711, \u00a713\n\"\"\"\n\nimport streamlit as st\n\n\ndef render_methodology_tab() -> None:\n    \"\"\"Render the Methodology & Theoretical Foundations Tab.\n\n    # Implements FR-10, FR-10-03\n    \"\"\"\n    st.markdown(\n        \"\"\"\n        <div style=\"margin-bottom:1.25rem;\">\n            <div style=\"font-size:1.35rem; font-weight:700; color:#0F172A;\">C\u01a1 s\u1edf l\u00fd thuy\u1ebft v\u00e0 ph\u01b0\u01a1ng ph\u00e1p lu\u1eadn</div>\n            <div style=\"font-size:0.88rem; color:#64748B; margin-top:0.2rem;\">\n                Khung m\u00f4 h\u00ecnh h\u00f3a t\u00e1c t\u1eed (Agent-Based Model) kh\u1ea3o s\u00e1t r\u1ee7i ro thanh l\u00fd ch\u00e9o v\u00e0 tr\u01b0\u1ee3t gi\u00e1 AMM trong DeFi Lending.\n            </div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n    col1, col2 = st.columns([1.1, 1], gap=\"large\")\n\n    with col1:\n        st.markdown(\n            \"\"\"\n            <div style=\"font-size:1.05rem; font-weight:700; color:#0F172A; margin-bottom:0.75rem;\">\n                1. Chu tr\u00ecnh l\u00e2y lan thanh l\u00fd ch\u00e9o (Cascade Pipeline)\n            </div>\n            <div class=\"flow-container\">\n                <div class=\"flow-card\">\n
