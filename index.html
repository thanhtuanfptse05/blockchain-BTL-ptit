              <div class=\"flow-step\">B\u01af\u1edaC 01</div>\n                    <div class=\"flow-title\">C\u00fa s\u1ed1c gi\u00e1 ngo\u1ea1i sinh t\u1ea1i Block 1</div>\n                    <div class=\"flow-desc\">Gi\u00e1 ETH gi\u1ea3m 15% l\u00e0m suy gi\u1ea3m gi\u00e1 tr\u1ecb t\u00e0i s\u1ea3n th\u1ebf ch\u1ea5p c\u1ee7a to\u00e0n b\u1ed9 ng\u01b0\u1eddi vay.</div>\n                </div>\n                <div class=\"flow-arrow\">\u2193</div>\n                <div class=\"flow-card\">\n                    <div class=\"flow-step\">B\u01af\u1edaC 02</div>\n                    <div class=\"flow-title\">H\u1ec7 s\u1ed1 an to\u00e0n suy gi\u1ea3m (Health Factor &lt; 1.0)</div>\n                    <div class=\"flow-desc\">C\u00e1c v\u1ecb th\u1ebf c\u00f3 t\u1ef7 l\u1ec7 vay cao (LTV ban \u0111\u1ea7u 0.65 - 0.72) r\u01a1i v\u00e0o ng\u01b0\u1ee1ng vi ph\u1ea1m an to\u00e0n.</div>\n                </div>\n                <div class=\"flow-arrow\">\u2193</div>\n                <div class=\"flow-card\">\n                    <div class=\"flow-step\">B\u01af\u1edaC 03</div>\n                    <div class=\"flow-title\">Thanh l\u00fd m\u1ed9t ph\u1ea7n 50% & Th\u01b0\u1edfng 5%</div>\n                    <div class=\"flow-desc\">Liquidator tr\u1ea3 50% n\u1ee3 thay ng\u01b0\u1eddi vay v\u00e0 t\u1ecbch thu t\u00e0i s\u1ea3n th\u1ebf ch\u1ea5p v\u1edbi m\u1ee9c chi\u1ebft kh\u1ea5u 5%.</div>\n                </div>\n                <div class=\"flow-arrow\">\u2193</div>\n                <div class=\"flow-card\">\n                    <div class=\"flow-step\">B\u01af\u1edaC 04</div>\n                    <div class=\"flow-title\">B\u00e1n th\u00e1o Collateral v\u00e0o 2 Pool AMM</div>\n                    <div class=\"flow-desc\">\n                        \u2022 <strong>Th\u1ebf ch\u1ea5p ETH:</strong> B\u00e1n th\u1eb3ng v\u00e0o Pool A (ETH/USDC) l\u1ea5y USDC.<br>\n                        \u2022 <strong>Th\u1ebf ch\u1ea5p stETH:</strong> X\u1ea3 v\u00e0o Pool B (stETH/ETH) l\u1ea5y ETH, r\u1ed3i b\u00e1n ti\u1ebfp ETH v\u00e0o Pool A.\n                    </div>\n                </div>\n                <div class=\"flow-arrow\">\u2193</div>\n                <div class=\"flow-card\">\n                    <div class=\"flow-step\">B\u01af\u1edaC 05</div>\n                    <div class=\"flow-title\">Tr\u01b0\u1ee3t gi\u00e1 AMM (Constant Product x\u00b7y = k)</div>\n                    <div class=\"flow-desc\">L\u1ef1c b\u00e1n l\u1edbn r\u00fat c\u1ea1n d\u1ef1 tr\u1eef USDC \u1edf Pool A v\u00e0 ETH \u1edf Pool B, l\u00e0m stETH m\u1ea5t peg s\u00e2u.</div>\n                </div>\n                <div class=\"flow-arrow\">\u2193</div>\n                <div class=\"flow-card flow-card-highlight\">\n                    <div class=\"flow-step\" style=\"color:#DC2626;\">B\u01af\u1edaC 06</div>\n                    <div class=\"flow-title\" style=\"color:#991B1B;\">L\u00e2y lan sang c\u00e1c kh\u1ed1i ti\u1ebfp theo (Domino Effect)</div>\n                    <div class=\"flow-desc\">M\u1ee9c gi\u00e1 m\u1edbi ti\u1ebfp t\u1ee5c \u0111\u1ea9y c\u00e1c v\u1ecb th\u1ebf an to\u00e0n tr\u01b0\u1edbc \u0111\u00f3 v\u00e0o v\u00f2ng xo\u00e1y thanh l\u00fd m\u1edbi.</div>\n                </div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n    with col2:\n        st.markdown(\n            \"\"\"\n            <div style=\"font-size:1.05rem; font-weight:700; color:#0F172A; margin-bottom:0.75rem;\">\n                2. C\u00e1c c\u00f4ng th\u1ee9c to\u00e1n h\u1ecdc c\u1ed1t l\u00f5i\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n        st.markdown(\n            \"\"\"\n            <div class=\"formula-card\">\n                <div class=\"formula-badge\">H\u1ec6 S\u1ed0 AN TO\u00c0N V\u1eca TH\u1ebe</div>\n                <div class=\"formula-title\">Health Factor (HF)</div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n        st.latex(r\"HF = \\frac{\\sum (Collateral_i \\times Price_i \\times LT_i)}{Debt}\")\n        st.markdown(\n            \"\"\"\n                <div class=\"formula-desc\">\n                    Ng\u01b0\u1ee1ng thanh l\u00fd quy \u0111\u1ecbnh <code>LT = 0.80</code> (80%). V\u1ecb th\u1ebf r\u01a1i v\u00e0o di\u1ec7n thanh l\u00fd khi <code>HF &lt; 1.0</code>.\n                </div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n        st.markdown(\n            \"\"\"\n            <div class=\"formula-card\">\n                <div class=\"formula-badge\">M\u00d4 H\u00ccNH T\u1ea0O L\u1eacP TH\u1eca TR\u01af\u1edcNG AMM</div>\n                <div class=\"formula-title\">Constant-Product Zero-Fee Swap</div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n        st.latex(r\"x \\cdot y = k \\implies y_{out} = \\frac{y \\cdot \\Delta x}{x + \\Delta x}\")\n        st.markdown(\n            \"\"\"\n                <div class=\"formula-desc\">\n                    B\u1ea3o to\u00e0n t\u00edch s\u1ed1 <code>k</code>. Gi\u00e1 giao ngay <code>P = y / x</code> bi\u1ebfn \u0111\u1ed9ng t\u1ef1 nhi\u00ean theo t\u1ef7 l\u1ec7 d\u1ef1 tr\u1eef sau swap.\n                </div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n        st.markdown(\n            \"\"\"\n            <div class=\"formula-card\">\n                <div class=\"formula-badge\">\u0110O L\u01af\u1edcNG M\u1ee8C \u0110\u1ed8 M\u1ea4T PEG</div>\n                <div class=\"formula-title\">T\u1ef7 l\u1ec7 chi\u1ebft kh\u1ea5u stETH (Discount %)</div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n        st.latex(r\"\\text{Discount}(\\%) = \\frac{P_{ETH} - P_{stETH}}{P_{ETH}} \\times 100\\%\")\n        st.markdown(\n            \"\"\"\n                <div class=\"formula-desc\">\n                    \u0110o l\u01b0\u1eddng \u0111\u1ed9 l\u1ec7ch gi\u00e1 gi\u1eefa stETH v\u00e0 ETH do \u00e1p l\u1ef1c b\u00e1n th\u00e1o d\u1ed3n v\u00e0o Pool B (stETH/ETH).\n                </div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n    st.markdown(\"<hr style='border:0; border-top:1px solid #E2E8F0; margin:1.5rem 0;'>\", unsafe_allow_html=True)\n\n    st.markdown(\n        \"\"\"\n        <div style=\"font-size:1.05rem; font-weight:700; color:#0F172A; margin-bottom:0.75rem;\">\n            3. Ph\u00e2n lo\u1ea1i m\u1ee5c \u0111\u00edch c\u1ee7a 3 k\u1ecbch b\u1ea3n \u0111\u1ed1i ch\u1ee9ng\n        </div>\n        <div class=\"scenario-grid\">\n            <div class=\"scenario-box box-sc01\">\n                <div class=\"scenario-tag tag-sc01\">SC01: BASELINE</div>\n                <div class=\"scenario-name\">M\u00f4i tr\u01b0\u1eddng \u0111\u1ed1i ch\u1ee9ng t\u0129nh</div>\n                <div class=\"scenario-body\">Gi\u00e1 ETH gi\u1eef nguy\u00ean $3,000. Kh\u00f4ng c\u00f3 bi\u1ebfn \u0111\u1ed9ng gi\u00e1, x\u00e1c nh\u1eadn 0 thanh l\u00fd v\u00e0 0 n\u1ee3 x\u1ea5u.</div>\n            </div>\n            <div class=\"scenario-box box-sc02\">\n                <div class=\"scenario-tag tag-sc02\">SC02: DIRECT SHOCK</div>\n                <div class=\"scenario-name\">C\u00fa s\u1ed1c ngo\u1ea1i sinh ban \u0111\u1ea7u</div>\n                <div class=\"scenario-body\">Gi\u00e1 ETH gi\u1ea3m 15% t\u1ea1i Block 1 nh\u01b0ng kh\u00f4ng b\u00e1n v\u00e0o AMM \u0111\u1ec3 c\u00f4 l\u1eadp s\u1ed1 v\u1ecb th\u1ebf v\u1ee1 n\u1ee3 ban \u0111\u1ea7u (17 ng\u01b0\u1eddi).</div>\n            </div>\n            <div class=\"scenario-box box-sc03\">\n                <div class=\"scenario-tag tag-sc03\">SC03: CASCADE CONTAGION</div>\n                <div class=\"scenario-name\">L\u00e2y lan thanh l\u00fd ch\u00e9o</div>\n                <div class=\"scenario-body\">B\u00e1n to\u00e0n b\u1ed9 collateral v\u00e0o 2 Pool AMM, k\u00edch ho\u1ea1t v\u00f2ng xo\u00e1y tr\u01b0\u1ee3t gi\u00e1, depeg stETH v\u00e0 n\u1ee3 x\u1ea5u lan r\u1ed9ng.</div>\n            </div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n    st.markdown(\"<hr style='border:0; border-top:1px solid #E2E8F0; margin:1.5rem 0;'>\", unsafe_allow_html=True)\n\n    st.markdown(\n        \"\"\"\n        <div style=\"font-size:1.05rem; font-weight:700; color:#0F172A; margin-bottom:0.6rem;\">\n            4. Gi\u1ea3 \u0111\u1ecbnh v\u00e0 gi\u1edbi h\u1ea1n nghi\u00ean c\u1ee9u (SRS \u00a713)\n        </div>\n        <div class=\"limitations-container\">\n            <ol style=\"margin:0; padding-left:1.2rem; color:#475569; font-size:0.86rem; line-height:1.65;\">\n                <li><strong>M\u00f4 h\u00ecnh AMM c\u01a1 b\u1ea3n (CPMM):</strong> Gi\u1ea3 l\u1eadp Constant-Product x \u00b7 y = k kh\u00f4ng ph\u00ed giao d\u1ecbch \u0111\u1ec3 c\u00e1ch ly \u0111\u1ed9 tr\u01b0\u1ee3t gi\u00e1 c\u01a1 b\u1ea3n; ch\u01b0a x\u00e9t \u0111\u1ebfn m\u00f4 h\u00ecnh thanh kho\u1ea3n t\u1eadp trung (Concentrated Liquidity nh\u01b0 Uniswap v3).</li>\n                <li><strong>Kh\u00f4ng x\u00e9t Arbitrageur:</strong> Gi\u1ea3 \u0111\u1ecbnh kh\u00f4ng c\u00f3 t\u00e1c t\u1eed kinh doanh ch\u00eanh l\u1ec7ch gi\u00e1 b\u01a1m v\u1ed1n c\u00e2n b\u1eb1ng hai pool; ph\u1ea3n \u00e1nh tr\u1ea1ng th\u00e1i th\u1ecb tr\u01b0\u1eddng ch\u1ecbu c\u0103ng th\u1eb3ng thanh kho\u1ea3n cao.</li>\n                <li><strong>Thanh l\u00fd t\u1ee9c th\u1eddi trong kh\u1ed1i:</strong> Ng\u01b0\u1eddi thanh l\u00fd h\u1ea5p th\u1ee5 v\u00e0 b\u00e1n th\u00e1o to\u00e0n b\u1ed9 t\u00e0i s\u1ea3n th\u1ebf ch\u1ea5p ngay trong kh\u1ed1i m\u00e0 kh\u00f4ng c\u00f3 \u0111\u1ed9 tr\u1ec5 huy \u0111\u1ed9ng v\u1ed1n.</li>\n                <li><strong>Chi ph\u00ed Gas b\u1eb1ng 0:</strong> Kh\u00f4ng x\u00e9t ph\u00ed giao d\u1ecbch m\u1ea1ng l\u01b0\u1edbi \u0111\u1ec3 t\u1eadp trung v\u00e0o \u0111\u1ed9ng l\u1ef1c kinh t\u1ebf h\u1ecdc c\u1ee7a vi\u1ec7c thanh l\u00fd.</li>\n                <li><strong>L\u00e3i su\u1ea5t vay c\u1ed1 \u0111\u1ecbnh:</strong> Ch\u01b0a m\u00f4 ph\u1ecfng bi\u1ebfn \u0111\u1ed9ng l\u00e3i su\u1ea5t vay theo t\u1ef7 l\u1ec7 s\u1eed d\u1ee5ng v\u1ed1n (Utilization Rate) trong pool cho vay.</li>\n            </ol>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n", "src/interface/components/metrics.py": "\"\"\"Analytics & Summary KPIs component.\n\nExtracts, aggregates, and renders core performance indicators and comparison metrics\nfor simulation scenarios.\n\n# Implements FR-07, FR-11, BR-10, SRS \u00a77.5, \u00a711, \u00a712.2\n\"\"\"\n\nfrom typing import List, Dict, Any, Optional\nfrom src.domain.simulation_result import KPISummary, SimulationResult\n\n\ndef format_usd(val: float) -> str:\n    \"\"\"Format a float as USD currency string with commas and 2 decimals.\n\n    # Implements FR-07-02\n    \"\"\"\n    return f\"${val:,.2f}\"\n\n\ndef format_pct(val: float) -> str:\n    \"\"\"Format a float as percentage string with 2 decimals.\n\n    # Implements FR-07-02\n    \"\"\"\n    return f\"{val:.2f}%\"\n\n\ndef calculate_kpi_summary(\n    sim_result: SimulationResult,\n    total_agents: int = 100,\n    ref_sc02: Optional[SimulationResult] = None,\n) -> KPISummary:\n    \"\"\"Extract and calculate the 6 core KPIs for a simulation result.\n\n    # Implements FR-07, FR-07-01, FR-07-03, SRS \u00a77.5\n\n    Args:\n        sim_result: The completed SimulationResult.\n        total_agents: Total count of borrower agents in the simulation.\n        ref_sc02: Optional reference SC02 SimulationResult for delta comparison.\n\n    Returns:\n        KPISummary instance populated with final metrics and optional deltas.\n    \"\"\"\n    final_block = sim_result.block_results[-1]\n    final_eth = final_block.eth_price_usd\n    final_steth = final_block.steth_price_usd\n    final_discount = final_block.steth_discount_pct\n    bad_debt = final_block.bad_debt_usd\n\n    unique_liquidated = len({ev.agent_id for ev in sim_result.liquidation_events})\n    total_events = len(sim_result.liquidation_events)\n    total_repaid = sum(ev.debt_repaid_usd for ev in sim_result.liquidation_events)\n    ratio_pct = (unique_liquidated / total_agents) * 100.0 if total_agents > 0 else 0.0\n\n    delta_eth: Optional[float] = None\n    delta_steth: Optional[float] = None\n    delta_discount: Optional[float] = None\n    delta_unique: Optional[int] = None\n    delta_events: Optional[int] = None\n    delta_bad_debt: Optional[float] = None\n\n    if ref_sc02 is not None:\n        ref_final = ref_sc02.block_results[-1]\n        delta_eth = final_eth - ref_final.eth_price_usd\n        delta_steth = final_steth - ref_final.steth_price_usd\n        delta_discount = final_discount - ref_final.steth_discount_pct\n\n        ref_unique = len({ev.agent_id for ev in ref_sc02.liquidation_events})\n        ref_events = len(ref_sc02.liquidation_events)\n        ref_bad_debt = ref_final.bad_debt_usd\n\n        delta_unique = unique_liquidated - ref_unique\n        delta_events = total_events - ref_events\n        delta_bad_debt = bad_debt - ref_bad_debt\n\n    return KPISummary(\n        scenario_id=sim_result.scenario_id,\n        final_eth_price_usd=final_eth,\n        final_steth_price_usd=final_steth,\n        final_steth_discount_pct=final_discount,\n        liquidated_agents_unique=unique_liquidated,\n        total_agents=total_agents,\n        liquidated_agents_ratio_pct=ratio_pct,\n        liquidation_events_total=total_events,\n        total_debt_repaid_usd=total_repaid,\n        bad_debt_usd=bad_debt,\n        delta_eth_price_usd=delta_eth,\n        delta_steth_price_usd=delta_steth,\n        delta_steth_discount_pct=delta_discount,\n        delta_liquidated_agents=delta_unique,\n        delta_liquidation_events=delta_events,\n        delta_bad_debt_usd=delta_bad_debt,\n    )\n\n\ndef _calc_relative_change(val_base: float, val_target: float) -> str:\n    \"\"\"Calculate relative percentage change with zero-division guard.\n\n    # Implements FR-07-04, FR-11\n    \"\"\"\n    if val_base == 0.0:\n        if val_target > 0.0:\n            return \"N/A\"\n        return \"0.0%\"\n    pct = ((val_target - val_base) / val_base) * 100.0\n    return f\"{pct:+.2f}%\"\n\n\ndef generate_comparison_table(\n    sc01: SimulationResult,\n    sc02: SimulationResult,\n    sc03: SimulationResult,\n) -> List[Dict[str, Any]]:\n    \"\"\"Generate side-by-side comparison rows for SC01, SC02, and SC03.\n\n    # Implements FR-11, SRS \u00a711, \u00a712.2\n\n    Args:\n        sc01: Baseline simulation result.\n        sc02: Direct shock simulation result.\n        sc03: Cascade contagion simulation result.\n\n    Returns:\n        List of dictionaries with comparison metrics and deltas.\n    \"\"\"\n    b1, b2, b3 = sc01.block_results[-1], sc02.block_results[-1], sc03.block_results[-1]\n    u1 = len({ev.agent_id for ev in sc01.liquidation_events})\n    u2 = len({ev.agent_id for ev in sc02.liquidation_events})\n    u3 = len({ev.agent_id for ev in sc03.liquidation_events})\n\n    e1 = len(sc01.liquidation_events)\n    e2 = len(sc02.liquidation_events)\n    e3 = len(sc03.liquidation_events)\n\n    r1 = sum(ev.debt_repaid_usd for ev in sc01.liquidation_events)\n    r2 = sum(ev.debt_repaid_usd for ev in sc02.liquidation_events)\n    r3 = sum(ev.debt_repaid_usd for ev in sc03.liquidation_events)\n\n    d_eth = b3.eth_price_usd - b2.eth_price_usd\n    d_steth = b3.steth_price_usd - b2.steth_price_usd\n    d_disc = b3.steth_discount_pct - b2.steth_discount_pct\n    d_u = u3 - u2\n    d_e = e3 - e2\n    d_r = r3 - r2\n    d_bd = b3.bad_debt_usd - b2.bad_debt_usd\n\n    rows = [\n        {\n            \"metric\": \"Final ETH Price ($)\",\n            \"unit\": \"USD\",\n            \"sc01_value\": format_usd(b1.eth_price_usd),\n            \"sc02_value\": format_usd(b2.eth_price_usd),\n            \"sc03_value\": format_usd(b3.eth_price_usd),\n            \"delta_sc03_sc02\": format_usd(d_eth),\n            \"relative_change\": _calc_relative_change(b2.eth_price_usd, b3.eth_price_usd),\n        },\n        {\n            \"metric\": \"Final stETH Price ($)\",\n            \"unit\": \"USD\",\n            \"sc01_value\": format_usd(b1.steth_price_usd),\n            \"sc02_value\": format_usd(b2.steth_price_usd),\n            \"sc03_value\": format_usd(b3.steth_price_usd),\n            \"delta_sc03_sc02\": format_usd(d_steth),\n            \"relative_change\": _calc_relative_change(b2.steth_price_usd, b3.steth_price_usd),\n        },\n        {\n            \"metric\": \"Final stETH Discount (%)\",\n            \"unit\": \"%\",\n            \"sc01_value\": format_pct(b1.steth_discount_pct),\n            \"sc02_value\": format_pct(b2.steth_discount_pct),\n            \"sc03_value\": format_pct(b3.steth_discount_pct),\n            \"delta_sc03_sc02\": f\"{d_disc:+.2f}%\",\n            \"relative_change\": _calc_relative_change(b2.steth_discount_pct, b3.steth_discount_pct),\n        },\n        {\n            \"metric\": \"Liquidated Agents (unique)\",\n            \"unit\": \"agents\",\n            \"sc01_value\": str(u1),\n            \"sc02_value\": str(u2),\n            \"sc03_value\": str(u3),\n            \"delta_sc03_sc02\": f\"{d_u:+d}\",\n            \"relative_change\": _calc_relative_change(float(u2), float(u3)),\n        },\n        {\n            \"metric\": \"Total Liquidation Events\",\n            \"unit\": \"events\",\n            \"sc01_value\": str(e1),\n            \"sc02_value\": str(e2),\n            \"sc03_value\": str(e3),\n            \"delta_sc03_sc02\": f\"{d_e:+d}\",\n            \"relative_change\": _calc_relative_change(float(e2), float(e3)),\n        },\n        {\n            \"metric\": \"Total Debt Repaid ($)\",\n            \"unit\": \"USD\",\n            \"sc01_value\": format_usd(r1),\n            \"sc02_value\": format_usd(r2),\n            \"sc03_value\": format_usd(r3),\n            \"delta_sc03_sc02\": format_usd(d_r),\n            \"relative_change\": _calc_relative_change(r2, r3),\n        },\n        {\n            \"metric\": \"Total Bad Debt ($)\",\n            \"unit\": \"USD\",\n            \"sc01_value\": format_usd(b1.bad_debt_usd),\n            \"sc02_value\": format_usd(b2.bad_debt_usd),\n            \"sc03_value\": format_usd(b3.bad_debt_usd),\n            \"delta_sc03_sc02\": format_usd(d_bd),\n            \"relative_change\": _calc_relative_change(b2.bad_debt_usd, b3.bad_debt_usd),\n        },\n    ]\n    return rows\n\n\ndef _render_card(col, label: str, value: str, delta: Optional[str], is_bad_metric: bool = False) -> None:\n    \"\"\"Helper to render a clean, human-designed KPI card in a Streamlit column.\"\"\"\n    delta_html = \"\"\n    if delta is not None:\n        if delta in (\"$0.00\", \"+0\", \"+0.00%\", \"0.00%\", \"0\"):\n            cls = \"delta-flat\"\n        elif is_bad_metric:\n            cls = \"delta-down\" if (delta.startswith(\"+\") or not delta.startswith(\"-\")) else \"delta-up\"\n        else:\n            cls = \"delta-down\" if delta.startswith(\"-\") else \"delta-up\"\n        delta_html = f'<div class=\"metric-delta {cls}\">{delta} vs SC02</div>'\n\n    html = f\"\"\"\n    <div class=\"metric-card\">\n        <div class=\"metric-label\">{label}</div>\n        <div class=\"metric-value\">{value}</div>\n        {delta_html}\n    </div>\n    \"\"\"\n    col.markdown(html, unsafe_allow_html=True)\n\n\ndef render_kpi_metrics(summary: KPISummary) -> None:\n    \"\"\"Render the 6 core KPI metric cards with clean financial layout in Streamlit UI.\n\n    # Implements FR-07, FR-07-06, NFR-06, SRS \u00a711, \u00a714.3\n\n    Args:\n        summary: Calculated KPISummary object.\n    \"\"\"\n    import streamlit as st\n\n    c1, c2, c3, c4, c5, c6 = st.columns(6)\n\n    d_eth = format_usd(summary.delta_eth_price_usd) if summary.delta_eth_price_usd is not None else None\n    _render_card(c1, \"Gi\u00e1 ETH cu\u1ed1i\", format_usd(summary.final_eth_price_usd), d_eth)\n\n    d_steth = format_usd(summary.delta_steth_price_usd) if summary.delta_steth_price_usd is not None else None\n    _render_card(c2, \"Gi\u00e1 stETH cu\u1ed1i\", format_usd(summary.final_steth_price_usd), d_steth)\n\n    d_disc = f\"{summary.delta_steth_discount_pct:+.2f}%\" if summary.delta_steth_discount_pct is not None else None\n    _render_card(c3, \"Chi\u1ebft kh\u1ea5u stETH\", format_pct(summary.final_steth_discount_pct), d_disc, is_bad_metric=True)\n\n    d_ag = f\"{summary.delta_liquidated_agents:+d}\" if summary.delta_liquidated_agents is not None else None\n    val_ag = f\"{summary.liquidated_agents_unique}/{summary.total_agents} ({summary.liquidated_agents_ratio_pct:.0f}%)\"\n    _render_card(c4, \"V\u1ecb th\u1ebf thanh l\u00fd\", val_ag, d_ag, is_bad_metric=True)\n\n    d_ev = f\"{summary.delta_liquidation_events:+d}\" if summary.delta_liquidation_events is not None else None\n    _render_card(c5, \"S\u1ed1 l\u1ea7n thanh l\u00fd\", str(summary.liquidation_events_total), d_ev, is_bad_metric=True)\n\n    d_bd = format_usd(summary.delta_bad_debt_usd) if summary.delta_bad_debt_usd is not None else None\n    _render_card(c6, \"N\u1ee3 x\u1ea5u ph\u00e1t sinh\", format_usd(summary.bad_debt_usd), d_bd, is_bad_metric=True)\n\n\n", "src/interface/components/sidebar.py": "\"\"\"Sidebar Component for Streamlit Dashboard.\n\nProvides interactive sliders for simulation parameters (P-01 to P-06)\nand Run/Reset buttons with clean, human-designed controls.\n\n# Implements FR-10-04, FR-10-05, FR-10-06, NFR-06, SRS \u00a75.1, \u00a712.1\n\"\"\"\n\nfrom typing import Tuple\nimport streamlit as st\nfrom src.domain.config import SimulationConfig\n\nDEFAULT_SHOCK_PCT = 15.0\nDEFAULT_POOL_A_TVL = 150_000_000.0\nDEFAULT_POOL_B_TVL = 80_000_000.0\nDEFAULT_NUM_BORROWERS = 100\nDEFAULT_MAX_BLOCKS = 30\nDEFAULT_SEED = 42\n\n\ndef render_sidebar() -> Tuple[bool, SimulationConfig]:\n    \"\"\"Render sidebar parameter widgets and control buttons.\n\n    # Implements FR-10-04, FR-10-05, FR-10-06, NFR-06\n\n    Returns:\n        Tuple of (run_clicked: bool, config: SimulationConfig).\n    \"\"\"\n    st.sidebar.markdown(\n        \"\"\"\n        <div style=\"margin-bottom:0.85rem; padding-bottom:0.5rem; border-bottom:1px solid #E2E8F0;\">\n            <div style=\"font-size:1.15rem; font-weight:700; color:#0F172A;\">Tham s\u1ed1 m\u00f4 ph\u1ecfng</div>\n            <div style=\"font-size:0.8rem; color:#64748B; margin-top:0.15rem;\">Kh\u1ea3o s\u00e1t t\u00e1c \u0111\u1ed9ng l\u00e2y lan qua c\u00e1c kh\u1ed1i</div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n    # Initialize session state with defaults\n    if \"param_shock_pct\" not in st.session_state:\n        st.session_state[\"param_shock_pct\"] = DEFAULT_SHOCK_PCT\n    if \"param_pool_a_tvl\" not in st.session_state:\n        st.session_state[\"param_pool_a_tvl\"] = DEFAULT_POOL_A_TVL\n    if \"param_pool_b_tvl\" not in st.session_state:\n        st.session_state[\"param_pool_b_tvl\"] = DEFAULT_POOL_B_TVL\n    if \"param_num_borrowers\" not in st.session_state:\n        st.session_state[\"param_num_borrowers\"] = DEFAULT_NUM_BORROWERS\n    if \"param_max_blocks\" not in st.session_state:\n        st.session_state[\"param_max_blocks\"] = DEFAULT_MAX_BLOCKS\n    if \"param_seed\" not in st.session_state:\n        st.session_state[\"param_seed\"] = DEFAULT_SEED\n\n    # Top Action Buttons\n    col_run, col_reset = st.sidebar.columns([1.3, 1])\n    with col_run:\n        run_top = st.button(\"Ch\u1ea1y m\u00f4 ph\u1ecfng\", type=\"primary\", use_container_width=True, key=\"btn_run_top\")\n    with col_reset:\n        if st.button(\"M\u1eb7c \u0111\u1ecbnh\", use_container_width=True, key=\"btn_reset_top\"):\n            st.session_state[\"param_shock_pct\"] = DEFAULT_SHOCK_PCT\n            st.session_state[\"param_pool_a_tvl\"] = DEFAULT_POOL_A_TVL\n            st.session_state[\"param_pool_b_tvl\"] = DEFAULT_POOL_B_TVL\n            st.session_state[\"param_num_borrowers\"] = DEFAULT_NUM_BORROWERS\n            st.session_state[\"param_max_blocks\"] = DEFAULT_MAX_BLOCKS\n            st.session_state[\"param_seed\"] = DEFAULT_SEED\n            st.rerun()\n\n    # Preset Scenarios with equal-length labels to prevent awkward text wrapping\n    st.sidebar.markdown(\"<div class='sidebar-section-title'>K\u1ecbch b\u1ea3n m\u1eabu</div>\", unsafe_allow_html=True)\n    col_p1, col_p2 = st.sidebar.columns(2)\n    with col_p1:\n        if st.button(\"C\u0103ng th\u1eb3ng\", use_container_width=True, key=\"preset_crisis\", help=\"Shock 30%, Pool A $80M, Pool B $30M\"):\n            st.session_state[\"param_shock_pct\"] = 30.0\n            st.session_state[\"param_pool_a_tvl\"] = 80_000_000.0\n            st.session_state[\"param_pool_b_tvl\"] = 30_000_000.0\n            st.rerun()\n    with col_p2:\n        if st.button(\"\u1ed4n \u0111\u1ecbnh\", use_container_width=True, key=\"preset_resilient\", help=\"Shock 5%, Pool A $300M, Pool B $150M\"):\n            st.session_state[\"param_shock_pct\"] = 5.0\n            st.session_state[\"param_pool_a_tvl\"] = 300_000_000.0\n            st.session_state[\"param_pool_b_tvl\"] = 150_000_000.0\n            st.rerun()\n\n    st.sidebar.markdown(\"<div class='sidebar-section-title'>1. C\u00fa s\u1ed1c gi\u00e1 ban \u0111\u1ea7u</div>\", unsafe_allow_html=True)\n\n    shock_pct = st.sidebar.slider(\n        label=\"C\u00fa s\u1ed1c gi\u00e1 ETH t\u1ea1i Block 1 (%)\",\n        min_value=0.0,\n        max_value=50.0,\n        value=float(st.session_state[\"param_shock_pct\"]),\n        step=0.5,\n        format=\"%.1f%%\",\n        help=\"M\u1ee9c gi\u1ea3m gi\u00e1 ETH ngo\u1ea1i sinh x\u1ea3y ra t\u1ea1i Block 1.\",\n        key=\"slider_shock_pct\",\n    )\n    st.session_state[\"param_shock_pct\"] = shock_pct\n\n    st.sidebar.markdown(\"<div class='sidebar-section-title'>2. Thanh kho\u1ea3n c\u00e1c pool AMM</div>\", unsafe_allow_html=True)\n\n    curr_a_m = int(round(float(st.session_state[\"param_pool_a_tvl\"]) / 1_000_000.0))\n    pool_a_m = st.sidebar.slider(\n        label=\"Pool A TVL \u2014 ETH/USDC\",\n        min_value=10,\n        max_value=500,\n        value=curr_a_m,\n        step=5,\n        format=\"$%dM\",\n        help=\"\u0110\u1ed9 s\u00e2u thanh kho\u1ea3n c\u1ee7a AMM Pool A (ETH/USDC).\",\n        key=\"slider_pool_a_m\",\n    )\n    pool_a_tvl = float(pool_a_m * 1_000_000.0)\n    st.session_state[\"param_pool_a_tvl\"] = pool_a_tvl\n\n    curr_b_m = int(round(float(st.session_state[\"param_pool_b_tvl\"]) / 1_000_000.0))\n    pool_b_m = st.sidebar.slider(\n        label=\"Pool B TVL \u2014 stETH/ETH\",\n        min_value=5,\n        max_value=200,\n        value=curr_b_m,\n        step=5,\n        format=\"$%dM\",\n        help=\"\u0110\u1ed9 s\u00e2u thanh kho\u1ea3n c\u1ee7a AMM Pool B (stETH/ETH).\",\n        key=\"slider_pool_b_m\",\n    )\n    pool_b_tvl = float(pool_b_m * 1_000_000.0)\n    st.session_state[\"param_pool_b_tvl\"] = pool_b_tvl\n\n    st.sidebar.markdown(\"<div class='sidebar-section-title'>3. C\u1ea5u h\u00ecnh m\u00f4 ph\u1ecfng</div>\", unsafe_allow_html=True)\n\n    num_borrowers = st.sidebar.slider(\n        label=\"S\u1ed1 l\u01b0\u1ee3ng ng\u01b0\u1eddi vay (Borrowers)\",\n        min_value=10,\n        max_value=500,\n        value=int(st.session_state[\"param_num_borrowers\"]),\n        step=10,\n        help=\"Quy m\u00f4 t\u1ed5ng s\u1ed1 t\u00e1c t\u1eed vay v\u1ed1n \u0111\u01b0\u1ee3c kh\u1edfi t\u1ea1o ng\u1eabu nhi\u00ean.\",\n        key=\"slider_num_borrowers\",\n    )\n    st.session_state[\"param_num_borrowers\"] = num_borrowers\n\n    max_blocks = st.sidebar.slider(\n        label=\"S\u1ed1 block m\u00f4 ph\u1ecfng\",\n        min_value=5,\n        max_value=100,\n        value=int(st.session_state[\"param_max_blocks\"]),\n        step=5,\n        help=\"Th\u1eddi l\u01b0\u1ee3ng s\u1ed1 block m\u00f4 ph\u1ecfng di\u1ec5n ti\u1ebfn ph\u1ea3n h\u1ed3i.\",\n        key=\"slider_max_blocks\",\n    )\n    st.session_state[\"param_max_blocks\"] = max_blocks\n\n    seed = st.sidebar.number_input(\n        label=\"H\u1ea1t gi\u1ed1ng ng\u1eabu nhi\u00ean (Seed)\",\n        min_value=0,\n        max_value=2_147_483_647,\n        value=int(st.session_state[\"param_seed\"]),\n        step=1,\n        help=\"H\u1ea1t gi\u1ed1ng sinh s\u1ed1 ng\u1eabu nhi\u00ean \u0111\u1ea3m b\u1ea3o t\u00ednh l\u1eb7p l\u1ea1i c\u1ee7a k\u1ebft qu\u1ea3.\",\n        key=\"input_seed\",\n    )\n    st.session_state[\"param_seed\"] = seed\n\n    st.markdown(\"<div style='margin-bottom:0.5rem;'></div>\", unsafe_allow_html=True)\n    run_bottom = st.sidebar.button(\"Ch\u1ea1y m\u00f4 ph\u1ecfng (Run)\", type=\"primary\", use_container_width=True, key=\"btn_run_bottom\")\n    run_clicked = run_top or run_bottom\n\n    config = SimulationConfig(\n        shock_pct=shock_pct,\n        pool_a_tvl_usd=pool_a_tvl,\n        pool_b_tvl_usd=pool_b_tvl,\n        num_borrowers=num_borrowers,\n        max_blocks=max_blocks,\n        seed=seed,\n    )\n\n    return run_clicked, config\n", "src/interface/components/__init__.py": "\"\"\"UI components package.\"\"\"\n\n"};
        const requirements = ["pandas", "numpy", "plotly", "pydantic"];

        stlite.mount({
            requirements: requirements,
            entrypoint: "src/interface/app.py",
            files: files,
            streamlitConfig: {
                "theme.base": "light",
                "theme.primaryColor": "#2563EB",
                "theme.backgroundColor": "#FFFFFF",
                "theme.secondaryBackgroundColor": "#F8FAFC",
                "theme.textColor": "#0F172A"
            }
        }, document.getElementById("root")).then(() => {
            const loader = document.getElementById("loading-screen");
            if (loader) loader.style.display = "none";
        });
    </script>
